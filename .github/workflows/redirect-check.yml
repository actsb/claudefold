# Does a blog URL answer directly, or redirect (and where to)? Search Console reports "Redirect error" for URLs that
# redirected when Googlebot fetched them. This asks the same URLs without following redirects, as Googlebot and as
# a browser, and prints each status and Location. Read-only. Manual only: Actions → Redirect check → Run workflow.
name: Redirect check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redirects:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Status and Location without following redirects
        run: |
          python3 - <<'EOF'
          import time, urllib.error, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          AGENTS = {"Googlebot": "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)",
                    "browser": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"}
          URLS = ["https://acts39.blogspot.com/2026/10/best-bidet-2026.html",
                  "http://acts39.blogspot.com/2026/10/best-bidet-2026.html",
                  "https://acts39.blogspot.com/2026/10/best-bidet-2026.html?m=1",
                  "https://acts39.blogspot.com/2026/09/best-wireless-earbuds-2026.html",
                  "https://acts39.blogspot.com/p/about-verdict-picks.html",
                  "https://acts39.blogspot.com/",
                  "https://acts39.blogspot.com/robots.txt"]
          def fetch(url, ua):
              for wait in (0, 20, 45, 90):   # Blogger answers bursts from datacenter IPs with 429
                  time.sleep(wait)
                  try:
                      r = opener.open(urllib.request.Request(url, headers={"User-Agent": ua}), timeout=30)
                      return r.status, r.headers.get("Location"), r.read(300).decode("utf-8", "replace")
                  except urllib.error.HTTPError as e:
                      if e.code == 429:
                          continue
                      return e.code, e.headers.get("Location"), ""
              return 429, None, ""
          for url in URLS:
              for name, ua in AGENTS.items():
                  time.sleep(8)
                  st, loc, body = fetch(url, ua)
                  extra = f" -> {loc}" if loc else ""
                  print(f"{st} [{name:9s}] {url}{extra}")
                  if url.endswith("robots.txt") and st == 200:
                      print("    " + body.strip().replace("\n", "\n    "))
          EOF
