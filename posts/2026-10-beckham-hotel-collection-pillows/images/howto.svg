<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Caring for the Beckham pillows in five minutes"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">Caring for the Beckham pillows in five minutes</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">Six steps from the vacuum pack to the fold test, from care guides we found for this pillow</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Let it loft</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Shake it out and wait a day, or 20</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">minutes on low heat.</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Add a protector</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">It keeps sweat and oils out of the fill.</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Fluff daily</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">A quick punch and shake delays the flat</text><text x="820.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">look.</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Wash gently</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Cold, gentle, two pillows at once, extra</text><text x="60.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">rinse, no softener.</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Dry low</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Low heat with dryer balls, then break up</text><text x="440.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">clumps.</text>
<rect x="800.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="340" r="20" fill="#1B2A41"/><text x="834.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="864.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Fold test</text>
<text x="820.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">If it stays folded, it is time to replace</text><text x="820.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">it.</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">Sources: care guides for this pillow (not confirmed as the maker's tag) and Cleveland Clinic's newsroom fold test. Read your own tag.</text>
</g></svg>