<text x="330.5" y="296.48" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#1B2A41">Hands-free photos, 3K video</text>
<text x="330.5" y="322.48" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#333">Tap the temple. 12MP shots and</text>
<text x="330.5" y="343.48" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#333">3K video from your own point of</text>
<text x="330.5" y="364.48" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#333">view.</text>
