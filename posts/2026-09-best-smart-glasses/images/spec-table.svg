<rect x="20" y="446" width="960" height="90" rx="8" fill="#F7F5F0"/>
<text x="36" y="470" font-weight="700" fill="#1B2A41" font-size="13">How to read it</text>
<text x="36" y="492">Battery figures are manufacturer claims for mixed use; Live AI on Meta glasses drains a charge in about 30 minutes. Weights are from reviewers' scales where published.</text>
<text x="36" y="510">"Rx" = prescription lenses available from the maker or a retrofit service; the Display's −4/+4 range is the tightest. XR glasses take snap-in inserts instead.</text>
<text x="36" y="528">Prices are US list, September 2026; Ray-Ban Meta Gen 1 clearance runs $224–$239 and Rokid Style has sold for $269. Android XR glasses (Google/Samsung) land this fall.</text>
</g>
