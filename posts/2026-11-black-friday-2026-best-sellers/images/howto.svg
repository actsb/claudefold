<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Is it a real Black Friday deal? Check it in 60 seconds"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">Is it a real Black Friday deal? Check it in 60 seconds</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">The four checks that catch most fake deals</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Match the model number</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Doorbuster TVs and bundles are often</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">store-only versions.</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Find the past low</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">A deal is real at or under the lowest</text><text x="440.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">price of the last year.</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Ignore the 'reg' price</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Some stores show a list price nobody</text><text x="820.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">pays.</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Check the seller</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Buy from the store or the maker, not a</text><text x="60.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">marketplace seller.</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Know the better day</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Adobe: TVs and toys on Black Friday,</text><text x="440.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">laptops on Cyber Monday.</text>
<rect x="800.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="340" r="20" fill="#1B2A41"/><text x="834.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="864.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Check recalls</text>
<text x="820.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Search cpsc.gov or our Recall Check for</text><text x="820.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">the exact model.</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">Sources: our deal checklist; Adobe 2026 holiday forecast (Sept 28, 2026); Which? (Nov 2025).</text>
</g></svg>