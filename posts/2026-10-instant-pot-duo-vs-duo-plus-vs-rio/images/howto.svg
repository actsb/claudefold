<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Your first Instant Pot run, in six steps"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">Your first Instant Pot run, in six steps</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">The water test and release methods from Instant Pot's own guidance</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Check the ring</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Silicone ring seated flat in the lid, rim</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">clean, pot dry.</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Add 3 cups of water</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Inner pot in the base, lid closed, valve</text><text x="440.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">on Sealing.</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Pressure cook 5 minutes</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Manual or Pressure Cook. The timer starts</text><text x="820.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">after pressure builds.</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Quick release</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Move the valve to Venting when it beeps.</text><text x="60.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">Wait for the float valve to drop.</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Respect the fill lines</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Never past 2/3; only to 1/2 for rice,</text><text x="440.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">beans and foods that expand.</text>
<rect x="800.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="340" r="20" fill="#1B2A41"/><text x="834.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="864.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Add thin liquid</text>
<text x="820.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">At least 1 to 1½ cups for a 6-quart;</text><text x="820.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">thick sauces do not count.</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">Source: Instant Pot test-run and FAQ pages (summaries, October 2026); follow your model's manual where it differs.</text>
</g></svg>