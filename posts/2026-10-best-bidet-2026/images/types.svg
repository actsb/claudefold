<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 706" role="img" aria-label="Which kind of bidet fits your bathroom?"><rect width="1200" height="706" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">Which kind of bidet fits your bathroom?</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">Five ways to add a bidet, from the cheapest to the most comfortable</text>
<rect x="40" y="116" width="1120" height="40" rx="10" fill="#1B2A41"/>
<text x="74" y="142" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Type</text>
<text x="282.0" y="142" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Typical price</text>
<text x="442.0" y="142" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Install</text>
<text x="692.0" y="142" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Needs</text>
<text x="912.0" y="142" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Best for</text>
<rect x="40" y="168" width="1120" height="81" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="60" cy="194" r="12" fill="#1E8E5A"/><path d="M 55 194 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="198" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">Cold attachment</text><text x="74" y="217" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">(LUXE NEO 120/185,</text><text x="74" y="236" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">KOHLER M100)</text>
<text x="282.0" y="196" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">$34–$75</text>
<text x="442.0" y="196" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">About 15 minutes, one</text><text x="442.0" y="215" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">wrench, under your own seat</text>
<text x="692.0" y="196" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Nothing: no outlet, no</text><text x="692.0" y="215" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">sink hookup</text>
<text x="912.0" y="196" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Almost everyone: the cheapest</text><text x="912.0" y="215" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">way to try it</text>
<rect x="40" y="259" width="1120" height="81" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="60" cy="285" r="12" fill="#C9781B"/><rect x="54" y="283.5" width="12" height="3" rx="1.5" fill="#fff"/>
<text x="74" y="289" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">Warm attachment</text><text x="74" y="308" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">(LUXE NEO 320,</text><text x="74" y="327" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">TUSHY Spa 3.0)</text>
<text x="282.0" y="287" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">$60–$149</text>
<text x="442.0" y="287" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">30–45 minutes; hot hose from</text><text x="442.0" y="306" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">the sink, often a small hole</text><text x="442.0" y="325" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">in the vanity</text>
<text x="692.0" y="287" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">A sink within about 9–10</text><text x="692.0" y="306" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">feet</text>
<text x="912.0" y="287" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">People who hate cool water</text><text x="912.0" y="306" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">but have no outlet</text>
<rect x="40" y="350" width="1120" height="100" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="60" cy="376" r="12" fill="#C9781B"/><rect x="54" y="374.5" width="12" height="3" rx="1.5" fill="#fff"/>
<text x="74" y="380" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">Manual bidet seat</text><text x="74" y="399" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">(KOHLER PureWash</text><text x="74" y="418" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">M300, Brondell</text><text x="74" y="437" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">EcoSeat)</text>
<text x="282.0" y="378" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">$90–$110</text>
<text x="442.0" y="378" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Replace the seat, about 20</text><text x="442.0" y="397" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">minutes</text>
<text x="692.0" y="378" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Elongated bowl for the</text><text x="692.0" y="397" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">M300</text>
<text x="912.0" y="378" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">A worn-out seat and a tidier</text><text x="912.0" y="397" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">look</text>
<rect x="40" y="460" width="1120" height="100" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="60" cy="486" r="12" fill="#C9781B"/><rect x="54" y="484.5" width="12" height="3" rx="1.5" fill="#fff"/>
<text x="74" y="490" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">Electric seat</text><text x="74" y="509" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">(SmartBidet</text><text x="74" y="528" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">SB-1000, TOTO S2,</text><text x="74" y="547" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">Bio Bidet BB-2000)</text>
<text x="282.0" y="488" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">$280–$550</text>
<text x="442.0" y="488" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">30 minutes, plus an</text><text x="442.0" y="507" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">electrician if there is no</text><text x="442.0" y="526" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">outlet ($130–$300)</text>
<text x="692.0" y="488" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">A GFCI outlet within</text><text x="692.0" y="507" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">about 4 feet</text>
<text x="912.0" y="488" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Warm water, heated seat and a</text><text x="912.0" y="507" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">dryer</text>
<rect x="40" y="570" width="1120" height="62" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="60" cy="596" r="12" fill="#C9781B"/><rect x="54" y="594.5" width="12" height="3" rx="1.5" fill="#fff"/>
<text x="74" y="600" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">Handheld sprayer or</text><text x="74" y="619" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">travel bidet</text>
<text x="282.0" y="598" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">$25–$80</text>
<text x="442.0" y="598" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Handheld: 15 minutes;</text><text x="442.0" y="617" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">travel: none</text>
<text x="692.0" y="598" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">A free hand and steady</text><text x="692.0" y="617" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">aim</text>
<text x="912.0" y="598" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Renters on a tight budget,</text><text x="912.0" y="617" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">trips, cleaning</text>
<text x="40" y="656" font-size="13" font-weight="400" fill="#888" text-anchor="start">Prices reported Nov 2025–Oct 2026 (brand sites, retailers, deal trackers); GFCI outlet cost from Angi (2026). The buttons in the guide show today's</text><text x="40" y="673" font-size="13" font-weight="400" fill="#888" text-anchor="start">prices.</text>
</g></svg>