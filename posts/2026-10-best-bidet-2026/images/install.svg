<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Install a non-electric bidet in about 15 minutes"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">Install a non-electric bidet in about 15 minutes</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">The six steps every attachment shares, and the one mistake that causes most leaks</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Turn off and flush</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Close the valve behind the toilet</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">(clockwise) and flush to empty the tank.</text><text x="60.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">Keep a towel under the fill valve.</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Check the fit first</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Seat bolts about 5.5 in apart, at least</text><text x="440.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">1.5 in of room behind them, and a tank</text><text x="440.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">that meets the bowl squarely.</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Seat off, bidet on</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Unbolt the seat, lay the attachment over</text><text x="820.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">the bolt holes, refit the seat. Firm, not</text><text x="820.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">cranked: plastic cracks.</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Fit the T-adapter</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">T-adapter onto the fill valve, the supply</text><text x="60.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">hose onto the T, the bidet hose onto the</text><text x="60.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">branch. Washers seated flat.</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Water on slowly</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Open the valve a little at a time and</text><text x="440.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">watch every joint for a minute. A drip</text><text x="440.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">means re-seat, not overtighten.</text>
<rect x="800.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="340" r="20" fill="#1B2A41"/><text x="834.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="864.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">First wash: lowest setting</text>
<text x="820.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Sit, then turn the knob slowly from the</text><text x="820.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">lowest pressure. Let the nozzle</text><text x="820.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">self-rinse before and after.</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">Sources: LUXE and Bio Bidet installation guides; fitment guides from Alpha and Bio Bidet; Good Housekeeping testers on install time. Always follow your model's manual.</text>
</g></svg>