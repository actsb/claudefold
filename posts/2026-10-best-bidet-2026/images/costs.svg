<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 592" role="img" aria-label="What a bidet really costs over three years"><rect width="1200" height="592" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
