<text x="707.0943396226415" y="196" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">$273</text>
<text x="939.5471698113208" y="196" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">About 7 months</text>
