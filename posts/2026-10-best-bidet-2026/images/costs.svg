<text x="939.5471698113208" y="484" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">About 11 years</text>
<text x="40" y="542" font-size="13" font-weight="400" fill="#888" text-anchor="start">Paper spend $182 a year (OnePoll survey via StudyFinds, 2020), cut by half; water + sewer $15.44 per 1,000 gal (2026); power 18¢/kWh (EIA 2026); GFCI</text><text x="40" y="559" font-size="13" font-weight="400" fill="#888" text-anchor="start">outlet about $210 (Angi). Our arithmetic; your numbers will differ.</text>
