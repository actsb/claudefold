<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="The Bedsure heated throw in five minutes"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">The Bedsure heated throw in five minutes</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">Six steps from the box to a warm sofa, with the safety habits the fire-safety groups ask for</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Check the label first</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Find the model number on the back label</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">or controller and compare it with the</text><text x="60.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">CPSC list from March 9, 2023 (it includes</text><text x="60.0" y="248" font-size="15" font-weight="400" fill="#333" text-anchor="start">BS-HB5060). A match means stop and use</text><text x="60.0" y="268" font-size="15" font-weight="400" fill="#333" text-anchor="start">the refund route.</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Lay it flat, plug it in</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Spread it on the sofa or over your lap.</text><text x="440.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">Do not fold, tuck or pile anything on top</text><text x="440.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">while it is on (ESFI).</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Connect the controller</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Join the control cord to the blanket</text><text x="820.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">first, then the power cord to the wall.</text><text x="820.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">Bedsure's troubleshooting guide says the</text><text x="820.0" y="248" font-size="15" font-weight="400" fill="#333" text-anchor="start">reverse order is a cause of the F2 error.</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Press Preheat, then drop the level</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Preheat heats fast, then hold a</text><text x="60.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">comfortable level (3 or 4 is what one</text><text x="60.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">reviewer liked). Keep the controller</text><text x="60.0" y="442" font-size="15" font-weight="400" fill="#333" text-anchor="start">uncovered.</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Know your auto-off</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">The listing for this throw says 8 hours;</text><text x="440.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">other Bedsure models stop at 3. Turn it</text><text x="440.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">off before you sleep anyway.</text>
<rect x="800.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="340" r="20" fill="#1B2A41"/><text x="834.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="864.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Washing: unplug and detach</text>
<text x="820.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Unplug from the wall, detach the control</text><text x="820.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">cord, gentle cold wash, no wringing, no</text><text x="820.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">ironing. Check your own manual.</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">Sources: Bedsure's guides and listing text (manual PDF not opened by us; check yours); ESFI electric-blanket safety pages.</text>
</g></svg>