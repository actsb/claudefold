<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="What buying pet supplies on Amazon gets you: delivery, returns, Subscribe and Save, and how to spot the real listing"><rect width="1200" height="620" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start" >What buying on Amazon actually gets you</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start" >The parts that matter for pet gear, from Amazon's own policy pages and 2025–2026 announcements.</text>
<rect x="40" y="110" width="550" height="225" rx="14" fill="#fff" stroke="#e3e1db"/><rect x="40" y="110" width="10" height="225" rx="5" fill="#1E8E5A"/>
<text x="70" y="154" font-size="22" font-weight="800" fill="#1B2A41" text-anchor="start" >Delivery</text>
<text x="70" y="194" font-size="17" font-weight="400" fill="#222" text-anchor="start" >Prime: same- or next-day on most of these in most</text>
<text x="70" y="224" font-size="17" font-weight="400" fill="#222" text-anchor="start" >US cities; same-day is free over $25</text>
<text x="70" y="254" font-size="17" font-weight="400" fill="#222" text-anchor="start" >Prime is $14.99/mo or $139/yr; 30-day free trial</text>
<rect x="610" y="110" width="550" height="225" rx="14" fill="#fff" stroke="#e3e1db"/><rect x="610" y="110" width="10" height="225" rx="5" fill="#1B2A41"/>
<text x="640" y="154" font-size="22" font-weight="800" fill="#1B2A41" text-anchor="start" >Returns</text>
<text x="640" y="194" font-size="17" font-weight="400" fill="#222" text-anchor="start" >30 days from delivery for these three</text>
<text x="640" y="224" font-size="17" font-weight="400" fill="#222" text-anchor="start" >Pet food and litter-type consumables: mostly</text>
<text x="640" y="254" font-size="17" font-weight="400" fill="#222" text-anchor="start" >non-returnable unless damaged</text>
<text x="640" y="284" font-size="17" font-weight="400" fill="#222" text-anchor="start" >Label-free drop-off at 10,000+ locations</text>
<rect x="40" y="355" width="550" height="225" rx="14" fill="#fff" stroke="#e3e1db"/><rect x="40" y="355" width="10" height="225" rx="5" fill="#C9781B"/>
<text x="70" y="399" font-size="22" font-weight="800" fill="#1B2A41" text-anchor="start" >Subscribe &amp; Save</text>
<text x="70" y="439" font-size="17" font-weight="400" fill="#222" text-anchor="start" >5% off every delivery; up to 15% with five or</text>
<text x="70" y="469" font-size="17" font-weight="400" fill="#222" text-anchor="start" >more subscriptions on one delivery day</text>
<text x="70" y="499" font-size="17" font-weight="400" fill="#222" text-anchor="start" >Food, litter, liners and filters qualify —</text>
<text x="70" y="529" font-size="17" font-weight="400" fill="#222" text-anchor="start" >the roller and the vacuum don't need it</text>
<rect x="610" y="355" width="550" height="225" rx="14" fill="#fff" stroke="#e3e1db"/><rect x="610" y="355" width="10" height="225" rx="5" fill="#3C8DAD"/>
<text x="640" y="399" font-size="22" font-weight="800" fill="#1B2A41" text-anchor="start" >Spot the real one</text>
<text x="640" y="439" font-size="17" font-weight="400" fill="#222" text-anchor="start" >Read both lines: 'Ships from' and 'Sold by'</text>
<text x="640" y="469" font-size="17" font-weight="400" fill="#222" text-anchor="start" >ChomChom: look for the Transparency code</text>
<text x="640" y="499" font-size="17" font-weight="400" fill="#222" text-anchor="start" >'#1 Best Seller' = top sales rank, updated hourly</text>
<text x="640" y="529" font-size="17" font-weight="400" fill="#222" text-anchor="start" >'Frequently returned item' is a warning, read it</text>
<text x="40" y="600" font-size="14" font-weight="400" fill="#777" text-anchor="start" >Prime price and trial length as of September 2026; return rules per Amazon's help pages; always check the buy box before paying.</text>
</g></svg>