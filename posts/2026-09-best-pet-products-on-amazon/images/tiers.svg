<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Three tiers of pet product: Good $25 ChomChom Roller, Better $85 Neakasa P1 Pro, Best $699 Litter-Robot 4"><rect width="1200" height="560" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
