<text x="40" y="551" font-size="13" font-weight="400" fill="#888" text-anchor="start">Read time: America's Test Kitchen (June 2025) except the TP19H, timed by Prudent Reviews (October 2025) in boiling water. Methods differ, so compare</text><text x="40" y="568" font-size="13" font-weight="400" fill="#888" text-anchor="start">within a column. Prices: ThermoWorks (Oct 23, 2026), Target (Oct 23, 2026), Serious Eats (May 2023). The buttons show today's price.</text>
