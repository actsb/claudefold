<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Check a turkey in five steps"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">Check a turkey in five steps</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">USDA's temperature, ThermoWorks' ice-bath check, and the step people skip</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Ice-bath check first</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Fill a glass with crushed ice, add water,</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">stir, probe in the middle. Expect about</text><text x="60.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">32 °F.</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Probe the thigh</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Push the tip into the innermost part of</text><text x="440.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">the thigh, not touching bone.</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Probe the breast</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Go into the thickest part of the breast,</text><text x="820.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">then the wing. All three need 165 °F.</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Wait for the number</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">A one-second thermometer settles fast; a</text><text x="60.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">slower one needs 3–8 seconds. Do not read</text><text x="60.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">early.</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Stuffing too</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Stuffing in the cavity needs 165 °F in</text><text x="440.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">its centre as well.</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">Sources: USDA FSIS safe temperature chart and turkey roasting guide (summaries read October 2026); ThermoWorks ice-bath guide. Follow your model's manual.</text>
</g></svg>