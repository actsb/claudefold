<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Set up a KitchenAid tilt-head the way the manual says"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">Set up a KitchenAid tilt-head the way the manual says</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">Six steps for the first week, while the return window is open</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Check the model</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">The plate under the head or the box</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">should say K45SS, KSM150, KSM3316 or</text><text x="60.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">KSM55, the one you paid for.</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Do the dime test</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Dime in the empty steel bowl, flat</text><text x="440.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">beater, speed 1. It should nudge the</text><text x="440.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">dime, not drag it.</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Turn the screw a little</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Clockwise lowers the beater on a</text><text x="820.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">tilt-head. At most 1/8 to 1/4 turn at a</text><text x="820.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">time.</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Dough on speed 2</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">The manual: never above speed 2 for yeast</text><text x="60.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">dough. About 2 minutes after it clings to</text><text x="60.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">the hook.</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Respect the flour limit</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Stiff dough is what makes tilt-heads</text><text x="440.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">bounce and run hot. Split big batches.</text>
<rect x="800.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="340" r="20" fill="#1B2A41"/><text x="834.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="864.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Let it cool</text>
<text x="820.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">If it stops or feels hot, unplug it and</text><text x="820.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">wait about 30 minutes before the next</text><text x="820.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">batch.</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">From KitchenAid's owner's manuals (KSM150, Mini KSM3300 series) and KitchenAid's help pages, read Nov 27, 2026.</text>
</g></svg>