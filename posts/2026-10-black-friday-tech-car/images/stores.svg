<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 702" role="img" aria-label="Where the rules differ: returns and price match"><rect width="1200" height="702" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">Where the rules differ: returns and price match</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">What each retailer did in the 2025 holiday season, and what we could not confirm for 2026</text>
<rect x="40" y="116" width="1120" height="40" rx="10" fill="#1B2A41"/>
<text x="74" y="142" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Store</text>
<text x="225.09090909090907" y="142" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Holiday returns (2025)</text>
<text x="530.5454545454545" y="142" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Price match</text>
<text x="866.5454545454545" y="142" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Watch for</text>
<rect x="40" y="168" width="1120" height="81" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="60" cy="194" r="12" fill="#C9781B"/><rect x="54" y="192.5" width="12" height="3" rx="1.5" fill="#fff"/>
<text x="74" y="198" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">Amazon</text>
<text x="225.09090909090907" y="196" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Bought Nov 1–Dec 31, returnable to</text><text x="225.09090909090907" y="215" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Jan 31, 2026 (Apple-branded items</text><text x="225.09090909090907" y="234" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">to Jan 15)</text>
<text x="530.5454545454545" y="196" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">No price match</text>
<text x="866.5454545454545" y="196" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Third-party sellers follow their</text><text x="866.5454545454545" y="215" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">own rules</text>
<rect x="40" y="259" width="1120" height="62" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="60" cy="285" r="12" fill="#C9781B"/><rect x="54" y="283.5" width="12" height="3" rx="1.5" fill="#fff"/>
<text x="74" y="289" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">Walmart</text>
<text x="225.09090909090907" y="287" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Bought Oct 1–Dec 31, returns to Jan</text><text x="225.09090909090907" y="306" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">31, 2026</text>
<text x="530.5454545454545" y="287" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Not confirmed for 2026</text>
<text x="866.5454545454545" y="287" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Marketplace sellers can differ</text>
<rect x="40" y="331" width="1120" height="62" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="60" cy="357" r="12" fill="#C9781B"/><rect x="54" y="355.5" width="12" height="3" rx="1.5" fill="#fff"/>
<text x="74" y="361" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">Target</text>
<text x="225.09090909090907" y="359" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Electronics bought Nov 1–Dec 24,</text><text x="225.09090909090907" y="378" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">returnable to Jan 24, 2026</text>
<text x="530.5454545454545" y="359" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Sources conflict; one says competitor</text><text x="530.5454545454545" y="378" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">matching ended in July 2025</text>
<text x="866.5454545454545" y="359" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Apple, Beats and phones get shorter</text><text x="866.5454545454545" y="378" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">windows</text>
<rect x="40" y="403" width="1120" height="81" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="60" cy="429" r="12" fill="#1E8E5A"/><path d="M 55 429 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="433" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">Best Buy</text>
<text x="225.09090909090907" y="431" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Holiday purchases returnable to</text><text x="225.09090909090907" y="450" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">about Jan 15, 2026</text>
<text x="530.5454545454545" y="431" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Own-price drops matched; no competitor</text><text x="530.5454545454545" y="450" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">matching from the Thursday before</text><text x="530.5454545454545" y="469" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Thanksgiving to Cyber Monday</text>
<text x="866.5454545454545" y="431" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Restocking fee up to 15% on some</text><text x="866.5454545454545" y="450" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">opened electronics</text>
<rect x="40" y="494" width="1120" height="62" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="60" cy="520" r="12" fill="#C9781B"/><rect x="54" y="518.5" width="12" height="3" rx="1.5" fill="#fff"/>
<text x="74" y="524" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">Costco</text>
<text x="225.09090909090907" y="522" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Holiday window not found</text>
<text x="530.5454545454545" y="522" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">No match, but credits the difference if</text><text x="530.5454545454545" y="541" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">its own price drops within 30 days</text>
<text x="866.5454545454545" y="522" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Check the current electronics</text><text x="866.5454545454545" y="541" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">return limit</text>
<rect x="40" y="566" width="1120" height="62" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="60" cy="592" r="12" fill="#C8102E"/><path d="M 55.5 587.5 l 9 9 M 64.5 587.5 l -9 9" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
<text x="74" y="596" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">Brand stores</text>
<text x="225.09090909090907" y="594" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Not retrieved for Jackery, Anker,</text><text x="225.09090909090907" y="613" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">EcoFlow, Roborock or Dreame</text>
<text x="530.5454545454545" y="594" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Not applicable</text>
<text x="866.5454545454545" y="594" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Read the return page before</text><text x="866.5454545454545" y="613" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">ordering from a brand site</text>
<text x="40" y="652" font-size="13" font-weight="400" fill="#888" text-anchor="start">Sources: Yahoo Finance retail roundup, Priceva, TechBuzz (Oct 28, 2025), read Oct 14, 2026. 2026 terms were not published when we checked; confirm on</text><text x="40" y="669" font-size="13" font-weight="400" fill="#888" text-anchor="start">the store's page before buying.</text>
</g></svg>