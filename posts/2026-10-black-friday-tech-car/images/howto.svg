<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="How to check a tech or car deal in five minutes"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">How to check a tech or car deal in five minutes</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">The same six steps work for every pick in this guide</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Set the number</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Before the sale, write the price you</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">would pay. Use our target for each pick,</text><text x="60.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">not the banner.</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Match the model</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Saros 10 vs 10R, Plus vs plain DELTA 3,</text><text x="440.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">AirTag 1st vs 2nd gen, C1000 vs C1000X</text><text x="440.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">Gen2. Deals often name a cousin.</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Judge the street price</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Wirecutter compares a deal with what the</text><text x="820.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">item usually sells for, not the list</text><text x="820.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">price. A "was" price only counts if it</text><text x="820.0" y="248" font-size="15" font-weight="400" fill="#333" text-anchor="start">was real recently (FTC).</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Open three stores</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">The brand store, Walmart and Best Buy or</text><text x="60.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">Target. Power-station and robot brands</text><text x="60.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">run their own sales.</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Read the returns</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Holiday windows ran to mid- or late</text><text x="440.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">January in 2025. Test the item that week;</text><text x="440.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">a jump starter fails at 3 a.m., not in</text><text x="440.0" y="442" font-size="15" font-weight="400" fill="#333" text-anchor="start">the box.</text>
<rect x="800.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="340" r="20" fill="#1B2A41"/><text x="834.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="864.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Pay by card, keep proof</text>
<text x="820.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">A credit card adds dispute protection</text><text x="820.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">(FTC). Save the order number, and</text><text x="820.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">photograph a bundle's contents on</text><text x="820.0" y="442" font-size="15" font-weight="400" fill="#333" text-anchor="start">arrival.</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">Sources: FTC consumer alert (Nov 2025) and Guides Against Deceptive Pricing, Consumer Reports Black Friday tips (2025), a Wirecutter podcast transcript (Nov 2024). Our synthesis.</text>
</g></svg>