<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Fill a tire the right way"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">Fill a tire the right way</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">NHTSA and AAA, five steps for any inflator</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">1. Find the number</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Door-jamb label or owner’s manual, not</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">the tire sidewall.</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">2. Check cold</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Parked 3 hours or more; warm tires read</text><text x="440.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">4–6 psi high.</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">3. Preset and fill</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Set the target psi, attach firmly, let it</text><text x="820.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">stop.</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">4. Recheck by gauge</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">A stick gauge is the cross-check owners</text><text x="60.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">recommend.</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">5. Do it monthly</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">AAA found warning lights come on at 20%</text><text x="440.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">low or worse.</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">Sources: NHTSA tire safety page; AAA "How to check tire pressure". Follow your inflator’s manual where it differs.</text>
</g></svg>