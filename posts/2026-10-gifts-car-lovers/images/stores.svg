<text x="300" y="324" font-size="16" font-weight="400" fill="#333" text-anchor="start">Ryobi P737D about $37</text>
<text x="500" y="324" font-size="15" font-weight="400" fill="#333" text-anchor="start">Free pickup</text>
<text x="700" y="324" font-size="15" font-weight="400" fill="#333" text-anchor="start">90 days in store</text>
<text x="880" y="316" font-size="13" font-weight="400" fill="#444" text-anchor="start">Best for bare cordless-tool</text><text x="880" y="331" font-size="13" font-weight="400" fill="#444" text-anchor="start">inflators and vacuums.</text>
<rect x="40" y="354" width="1120" height="52" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="66" cy="380" r="12" fill="#C9781B"/><rect x="60" y="378.5" width="12" height="3" rx="1.5" fill="#fff"/>
