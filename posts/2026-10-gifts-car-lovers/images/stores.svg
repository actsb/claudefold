<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Where to buy, and when Amazon is not the cheapest"><rect width="1200" height="520" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">Where to buy, and when Amazon is not the cheapest</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">October 2026: what search summaries showed; the buttons show today’s price</text>
<rect x="40" y="116" width="1120" height="40" rx="10" fill="#1B2A41"/>
<text x="60" y="142" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Store</text>
<text x="300" y="142" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Price seen</text>
<text x="500" y="142" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Delivery</text>
<text x="700" y="142" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Returns</text>
<text x="880" y="142" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Note</text>
<rect x="40" y="168" width="1120" height="52" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="66" cy="194" r="12" fill="#1E8E5A"/><path d="M 61 194 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="88" y="200" font-size="17" font-weight="700" fill="#1B2A41" text-anchor="start">Amazon</text>
<text x="300" y="200" font-size="16" font-weight="400" fill="#333" text-anchor="start">The button shows today's</text>
<text x="500" y="200" font-size="15" font-weight="400" fill="#333" text-anchor="start">Prime where eligible</text>
<text x="700" y="200" font-size="15" font-weight="400" fill="#333" text-anchor="start">Check the listing</text>
<text x="880" y="192" font-size="13" font-weight="400" fill="#444" text-anchor="start">Deepest cuts come on deal days</text><text x="880" y="207" font-size="13" font-weight="400" fill="#444" text-anchor="start">(33–40% on car items Oct 6–7).</text>
<rect x="40" y="230" width="1120" height="52" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="66" cy="256" r="12" fill="#C9781B"/><rect x="60" y="254.5" width="12" height="3" rx="1.5" fill="#fff"/>
<text x="88" y="262" font-size="17" font-weight="700" fill="#1B2A41" text-anchor="start">Walmart</text>
<text x="300" y="262" font-size="16" font-weight="400" fill="#333" text-anchor="start">GB40 about $100, F7NP about $130</text>
<text x="500" y="262" font-size="15" font-weight="400" fill="#333" text-anchor="start">Free over the store minimum</text>
<text x="700" y="262" font-size="15" font-weight="400" fill="#333" text-anchor="start">Holiday buys returnable to Jan 31, 2027</text>
<text x="880" y="254" font-size="13" font-weight="400" fill="#444" text-anchor="start">Often matches Amazon on jump</text><text x="880" y="269" font-size="13" font-weight="400" fill="#444" text-anchor="start">starters and inflators.</text>
<rect x="40" y="292" width="1120" height="52" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="66" cy="318" r="12" fill="#C9781B"/><rect x="60" y="316.5" width="12" height="3" rx="1.5" fill="#fff"/>
