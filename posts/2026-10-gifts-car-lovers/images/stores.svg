<text x="300" y="386" font-size="16" font-weight="400" fill="#333" text-anchor="start">Work lights under $25</text>
<text x="500" y="386" font-size="15" font-weight="400" fill="#333" text-anchor="start">Free pickup</text>
<text x="700" y="386" font-size="15" font-weight="400" fill="#333" text-anchor="start">90 days with receipt</text>
<text x="880" y="378" font-size="13" font-weight="400" fill="#444" text-anchor="start">Cheapest for the work light and</text><text x="880" y="393" font-size="13" font-weight="400" fill="#444" text-anchor="start">tools.</text>
<rect x="40" y="416" width="1120" height="52" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="66" cy="442" r="12" fill="#C8102E"/><path d="M 61.5 437.5 l 9 9 M 70.5 437.5 l -9 9" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
<text x="88" y="448" font-size="17" font-weight="700" fill="#1B2A41" text-anchor="start">Temu / look-alikes</text>
<text x="300" y="448" font-size="16" font-weight="400" fill="#333" text-anchor="start">Often lowest</text>
<text x="500" y="448" font-size="15" font-weight="400" fill="#333" text-anchor="start">Slow</text>
<text x="700" y="448" font-size="15" font-weight="400" fill="#333" text-anchor="start">Varies by seller</text>
<text x="880" y="440" font-size="13" font-weight="400" fill="#444" text-anchor="start">Skip for a jump starter or</text><text x="880" y="455" font-size="13" font-weight="400" fill="#444" text-anchor="start">inflator you will trust.</text>
<text x="40" y="498" font-size="13" font-weight="400" fill="#888" text-anchor="start">Return windows as reported in search summaries on October 10, 2026; check each store’s policy before you buy.</text>
</g></svg>