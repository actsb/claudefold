<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="The Instant Pot Duo in five minutes"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">The Instant Pot Duo in five minutes</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">Six steps from box to first meal, from the Instant Pot Duo v5 manual (Aug 2025)</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Run the test</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Steam with water, no food, 5 minutes;</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">discard the water.</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Seat the ring</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Press down, no puckering; replace every</text><text x="440.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">12–18 months.</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Add liquid</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">1½ cups minimum for 6 qt; stay below PC</text><text x="820.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">MAX.</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Lock and seal</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Arrow to lock, switch to Seal; up to 30</text><text x="60.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">min to pressure.</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Pick a release</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Natural for stews and beans, quick for</text><text x="440.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">vegetables.</text>
<rect x="800.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="340" r="20" fill="#1B2A41"/><text x="834.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="864.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Open with care</text>
<text x="820.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Wait for the float valve; hands away from</text><text x="820.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">steam.</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">Source: Instant Pot Duo v5 user manual, Aug 2025; read your own model's manual.</text>
</g></svg>