<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="The REDTIGER F7NP in five minutes"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">The REDTIGER F7NP in five minutes</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">Six steps from box to first clip, drawn from the F7NP guides and owner tips</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Mount</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Behind the rearview mirror, clear of the</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">wipers.</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Power</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Car charger first; hardwire kit later.</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Add a card</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">High-endurance microSD; format it</text><text x="820.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">in-camera.</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Turn on Wi-Fi</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">It is off by default; pair the phone app.</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Set the clock</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Time zone, GPS stamp; check after Nov 1.</text>
<rect x="800.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="340" r="20" fill="#1B2A41"/><text x="834.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="864.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Test it</text>
<text x="820.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Record, play back, then check the card</text><text x="820.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">monthly.</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">Sources: REDTIGER F7NP manual and brand guides; owner tips on DashCamTalk. Read your own manual.</text>
</g></svg>