<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Which day? A five-step plan for Cyber Week"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">Which day? A five-step plan for Cyber Week</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">Works for every category in this guide</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Set the number</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Write a price for each item before the</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">sale. Use our good and great lines, not</text><text x="60.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">the banner.</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Match the day to the category</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Appliances and vacuums: Black Friday.</text><text x="440.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">Electronics and earbuds: Cyber Monday</text><text x="440.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">(Adobe).</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Buy early where it is protected</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Target matches its own lower price to Dec</text><text x="820.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">24; Best Buy matches its own drops;</text><text x="820.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">Costco.com adjusts for 30 days.</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Be careful at Walmart</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Walmart.com gives no adjustment after you</text><text x="60.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">buy, so buy there at the low, not before</text><text x="60.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">it.</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Check the model number</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Retailer-only versions (a Shark IZ840HRW,</text><text x="440.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">a Little Green 3369) are not the model</text><text x="440.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">you compared.</text>
<rect x="800.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="340" r="20" fill="#1B2A41"/><text x="834.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="864.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Keep the receipt</text>
<text x="820.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Holiday return windows run to mid or late</text><text x="820.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">January at Target and Best Buy.</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">Sources: Adobe holiday forecast (Sept 28, 2026), store holiday calendars (Oct–Nov 2026), Target, Best Buy and Costco price-adjustment pages. Our synthesis.</text>
</g></svg>