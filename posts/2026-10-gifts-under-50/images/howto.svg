<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="How to give a gift that gets kept"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">How to give a gift that gets kept</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">Five checks before you order, from the owner reports in this guide</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">1. Match the person</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Cooks, pet owners, iPhone users: pick by</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">habit, not by price.</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">2. Check the variant</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Dog weight for a KONG, iOS version for an</text><text x="440.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">AirTag, model for a throw.</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">3. Buy from the brand</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Owners report fakes and wrong items from</text><text x="820.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">marketplace sellers.</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">4. Add the care note</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Wash the Owala gasket weekly; hand-wash</text><text x="60.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">the Rubbermaid lids.</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">5. Send the receipt</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Wrong size is the top reason gifts come</text><text x="440.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">back (Axios, Dec 2025).</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">Sources: owner reports and expert pages named in this guide, October 2026. Return windows differ by store; check the one you use.</text>
</g></svg>