<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 664" role="img" aria-label="Where the rules differ: returns and price match"><rect width="1200" height="664" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">Where the rules differ: returns and price match</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">What each big retailer did in the 2025 holiday season, and what we could not confirm for 2026</text>
<rect x="40" y="116" width="1120" height="40" rx="10" fill="#1B2A41"/>
<text x="74" y="142" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Store</text>
<text x="225.09090909090907" y="142" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Holiday returns (2025)</text>
<text x="530.5454545454545" y="142" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Price match</text>
<text x="866.5454545454545" y="142" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Watch for</text>
<rect x="40" y="168" width="1120" height="62" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="60" cy="194" r="12" fill="#C9781B"/><rect x="54" y="192.5" width="12" height="3" rx="1.5" fill="#fff"/>
<text x="74" y="198" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">Amazon</text>
<text x="225.09090909090907" y="196" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Bought Nov 1–Dec 31, returnable to</text><text x="225.09090909090907" y="215" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Jan 31, 2026</text>
<text x="530.5454545454545" y="196" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Not covered by our sources</text>
<text x="866.5454545454545" y="196" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Third-party sellers follow their</text><text x="866.5454545454545" y="215" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">own rules</text>
<rect x="40" y="240" width="1120" height="62" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="60" cy="266" r="12" fill="#1E8E5A"/><path d="M 55 266 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="270" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">Walmart</text>
<text x="225.09090909090907" y="268" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Bought Oct 1–Dec 31, returns to Jan</text><text x="225.09090909090907" y="287" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">31 (2026 terms unconfirmed)</text>
<text x="530.5454545454545" y="268" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Limited; Amazon-sold identical items</text><text x="530.5454545454545" y="287" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">per third-party guides</text>
<text x="866.5454545454545" y="268" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Dyson and major appliances excluded</text><text x="866.5454545454545" y="287" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">from the extension</text>
<rect x="40" y="312" width="1120" height="62" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="60" cy="338" r="12" fill="#C9781B"/><rect x="54" y="336.5" width="12" height="3" rx="1.5" fill="#fff"/>
<text x="74" y="342" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">Target</text>
<text x="225.09090909090907" y="340" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">30 days from Dec 26 for electronics</text><text x="225.09090909090907" y="359" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">(to Jan 24, 2026)</text>
<text x="530.5454545454545" y="340" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Amazon and Walmart (sold and shipped by</text><text x="530.5454545454545" y="359" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">them), plus Target's own price</text>
<text x="866.5454545454545" y="340" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Apple and Beats get 14 days</text>
<rect x="40" y="384" width="1120" height="62" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="60" cy="410" r="12" fill="#C9781B"/><rect x="54" y="408.5" width="12" height="3" rx="1.5" fill="#fff"/>
<text x="74" y="414" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">Best Buy</text>
<text x="225.09090909090907" y="412" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Through Jan 15, 2026 for holiday</text><text x="225.09090909090907" y="431" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">purchases</text>
<text x="530.5454545454545" y="412" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Best Buy-sold items; Black Friday event</text><text x="530.5454545454545" y="431" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">prices excluded</text>
<text x="866.5454545454545" y="412" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Marketplace sellers and clearance</text><text x="866.5454545454545" y="431" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">excluded</text>
<rect x="40" y="456" width="1120" height="62" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="60" cy="482" r="12" fill="#C9781B"/><rect x="54" y="480.5" width="12" height="3" rx="1.5" fill="#fff"/>
<text x="74" y="486" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">Home Depot</text>
<text x="225.09090909090907" y="484" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">No extension; 90 days standard with</text><text x="225.09090909090907" y="503" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">receipt</text>
<text x="530.5454545454545" y="484" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Identical item from the retailer, at</text><text x="530.5454545454545" y="503" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">purchase only</text>
<text x="866.5454545454545" y="484" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Third-party sellers do not count</text>
<rect x="40" y="528" width="1120" height="62" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="60" cy="554" r="12" fill="#1E8E5A"/><path d="M 55 554 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="558" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">Costco</text>
<text x="225.09090909090907" y="556" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">90 days for electronics; small</text><text x="225.09090909090907" y="575" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">appliances unconfirmed</text>
<text x="530.5454545454545" y="556" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">No match, but a 30-day price adjustment</text><text x="530.5454545454545" y="575" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">on its own price drops</text>
<text x="866.5454545454545" y="556" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Promotions funded by the maker may</text><text x="866.5454545454545" y="575" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">be excluded</text>
<text x="40" y="614" font-size="13" font-weight="400" fill="#888" text-anchor="start">Sources: Amazon holiday return page (2025), Doctor of Credit and Priceva guides, Dealnews, 9to5Toys (Oct 20, 2025). 2026 terms were not published when</text><text x="40" y="631" font-size="13" font-weight="400" fill="#888" text-anchor="start">we checked; confirm on the store's page before buying.</text>
</g></svg>