<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="How to check a Black Friday price in five minutes"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">How to check a Black Friday price in five minutes</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">The same six steps work for every pick in this guide</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Set the number</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Before the sale, write the price you</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">would pay. Use our band for each pick,</text><text x="60.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">not the banner.</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Match the model</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Compare the model number: 300-P vs</text><text x="440.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">300S-P, Duo vs Duo Plus, 4-qt vs 6-qt.</text><text x="440.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">Deals often name a cousin.</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Check the history</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Chrome's Google Shopping price insights</text><text x="820.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">show the last 90 days and label a price</text><text x="820.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">low, typical or high.</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Compare three stores</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Open the brand's store, Walmart and</text><text x="60.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">Target or Home Depot. The listed "was"</text><text x="60.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">price is often a high list price.</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Read the returns</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Holiday windows run to January at most</text><text x="440.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">big stores. Home Depot keeps its normal</text><text x="440.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">90 days.</text>
<rect x="800.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="340" r="20" fill="#1B2A41"/><text x="834.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="864.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Pay by card, keep the proof</text>
<text x="820.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">A credit card adds dispute protection</text><text x="820.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">(FTC). Save the order number and receipt.</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">Sources: Google Shopping price insights and tracking (Google blog), FTC consumer advice on inflated "original" prices, Consumer Reports deal coverage. Our synthesis.</text>
</g></svg>