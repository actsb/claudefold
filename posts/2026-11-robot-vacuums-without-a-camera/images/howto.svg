<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Before you buy: settings and privacy"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">Before you buy: settings and privacy</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">Six things to do in the first week with a camera-free robot</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Clear the floor</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">LiDAR maps walls and furniture, not cords</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">and socks; testers say to pick them up</text><text x="60.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">first.</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Draw no-go zones</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Around desk cables and pet bowls. eufy</text><text x="440.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">warns zones can drop when the map</text><text x="440.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">changes.</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Skip data programs</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">eufy's User Experience Program, Ecovacs'</text><text x="820.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">product improvement program: leave them</text><text x="820.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">off.</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Lock the account</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">A long, unique app password; KISA found</text><text x="60.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">weak app logins on some brands in 2025.</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Mind the pets</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Do not schedule a run while a sick pet or</text><text x="440.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">a new puppy is home alone.</text>
<rect x="800.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="340" r="20" fill="#1B2A41"/><text x="834.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="864.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Reset before selling</text>
<text x="820.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Remove it from your account and</text><text x="820.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">factory-reset: DEF CON found data that</text><text x="820.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">outlived deletion.</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">From the makers' help pages (Roborock, iRobot, Tapo, eufy, Ecovacs), DEF CON 2024 research reported by TechCrunch, and owner threads, read November 23, 2026.</text>
</g></svg>