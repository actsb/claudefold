<text x="313.6822429906542" y="444" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">LDS (LiDAR)</text>
<text x="533.4953271028037" y="444" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Laser obstacle sensor</text>
<text x="920.7850467289718" y="444" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">No RGB camera</text>
<rect x="40" y="478" width="1120" height="52" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="60" cy="504" r="12" fill="#1E8E5A"/><path d="M 55 504 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="508" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">eufy Omni C28</text>
<text x="313.6822429906542" y="506" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">LDS (LiDAR)</text>
<text x="533.4953271028037" y="506" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Laser line</text>
<text x="920.7850467289718" y="506" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">No RGB camera</text>
<rect x="40" y="540" width="1120" height="52" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="60" cy="566" r="12" fill="#C8102E"/><path d="M 55.5 561.5 l 9 9 M 64.5 561.5 l -9 9" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
<text x="74" y="570" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">Roborock Saros 10R</text>
<text x="313.6822429906542" y="568" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">LiDAR + 3D ToF</text>
<text x="533.4953271028037" y="568" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">RGB camera with AI</text>
<text x="920.7850467289718" y="568" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Yes, can be off</text>
<rect x="40" y="602" width="1120" height="52" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="60" cy="628" r="12" fill="#C8102E"/><path d="M 55.5 623.5 l 9 9 M 64.5 623.5 l -9 9" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
<text x="74" y="632" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">Roomba Max 705</text>
<text x="313.6822429906542" y="630" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">LiDAR</text>
<text x="533.4953271028037" y="630" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">PrecisionVision camera</text>
<text x="920.7850467289718" y="630" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Yes, cannot be off</text>
<text x="40" y="678" font-size="13" font-weight="400" fill="#888" text-anchor="start">Sources: Roborock, TP-Link, iRobot (support article 31161 and fact sheets), Ecovacs, eufy pages; RTINGS and Roborock newsroom for the camera models.</text><text x="40" y="695" font-size="13" font-weight="400" fill="#888" text-anchor="start">Structured-light sensors read an infrared pattern; they are not RGB cameras.</text>
</g></svg>