<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 728" role="img" aria-label="What each robot sees, and with what"><rect width="1200" height="728" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">What each robot sees, and with what</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">From each maker's product and support pages, read November 23, 2026</text>
<rect x="40" y="116" width="1120" height="40" rx="10" fill="#1B2A41"/>
<text x="74" y="142" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Robot</text>
<text x="313.6822429906542" y="142" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Maps with</text>
<text x="533.4953271028037" y="142" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Sees what is ahead with</text>
<text x="920.7850467289718" y="142" font-size="15" font-weight="700" fill="#fff" text-anchor="start">Camera?</text>
<rect x="40" y="168" width="1120" height="52" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="60" cy="194" r="12" fill="#1E8E5A"/><path d="M 55 194 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="198" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">Roborock Q7 M5+</text>
<text x="313.6822429906542" y="196" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">LiDAR</text>
<text x="533.4953271028037" y="196" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Bumper only</text>
<text x="920.7850467289718" y="196" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">None</text>
<rect x="40" y="230" width="1120" height="52" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="60" cy="256" r="12" fill="#1E8E5A"/><path d="M 55 256 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
