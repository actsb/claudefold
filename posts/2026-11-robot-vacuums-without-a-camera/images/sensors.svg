<text x="313.6822429906542" y="258" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">LiDAR + IMU</text>
<text x="533.4953271028037" y="258" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">LiDAR and bumper</text>
<text x="920.7850467289718" y="258" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">None</text>
<rect x="40" y="292" width="1120" height="52" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="60" cy="318" r="12" fill="#1E8E5A"/><path d="M 55 318 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="322" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">Roomba 205</text>
<text x="313.6822429906542" y="320" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">ClearView LiDAR</text>
<text x="533.4953271028037" y="320" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">LiDAR and bumper</text>
<text x="920.7850467289718" y="320" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">None (iRobot list)</text>
<rect x="40" y="354" width="1120" height="52" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="60" cy="380" r="12" fill="#1E8E5A"/><path d="M 55 380 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="384" font-size="16" font-weight="700" fill="#1B2A41" text-anchor="start">Roborock Q10 S5+</text>
<text x="313.6822429906542" y="382" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">LiDAR</text>
<text x="533.4953271028037" y="382" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">Structured light (infrared)</text>
<text x="920.7850467289718" y="382" font-size="14.5" font-weight="400" fill="#333" text-anchor="start">No RGB camera</text>
<rect x="40" y="416" width="1120" height="52" rx="10" fill="#fff" stroke="#E3E1DB"/>
<circle cx="60" cy="442" r="12" fill="#1E8E5A"/><path d="M 55 442 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
