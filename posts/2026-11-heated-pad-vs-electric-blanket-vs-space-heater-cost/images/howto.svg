<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Find your own cost per night in five minutes"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">Find your own cost per night in five minutes</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">The same formula works for any heater, pad or blanket</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Find the watts</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Read the label on the controller or</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">heater. If two controls, add them.</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Find your rate</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Your bill shows cents per kWh; add</text><text x="440.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">delivery charges. The US average is</text><text x="440.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">18.16¢.</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Multiply</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Watts ÷ 1,000 × hours = kWh. 1,500 W × 8</text><text x="820.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">h = 12 kWh.</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Price it</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">kWh × your rate. 12 kWh × $0.18 = $2.16 a</text><text x="60.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">night.</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Cut it down</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">A thermostat cycles a heater off;</text><text x="440.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">auto-off stops a pad after 10 hours.</text>
<rect x="800.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="340" r="20" fill="#1B2A41"/><text x="834.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="864.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Compare</text>
<text x="820.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Run the same sum for what you would use</text><text x="820.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">instead and keep the cheaper night.</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">Formula from the U.S. Department of Energy's 'What does it cost to run an appliance?' sheet and Consumer Reports (updated Oct 2025).</text>
</g></svg>