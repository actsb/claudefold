<text x="40" y="604" font-size="13" font-weight="400" fill="#888" text-anchor="start">Cost = watts ÷ 1,000 × 8 hours × price. Watts: Walmart listing (Sunbeam Wi-Fi queen pad 120 W), Target (Biddeford 130 W per controller), Dreo and</text><text x="40" y="621" font-size="13" font-weight="400" fill="#888" text-anchor="start">Pelonis maker specs, retailer listings (Bedsure throw 100 W); the queen blanket range is our assumption. Prices: EIA US residential average 18.16¢/kWh</text><text x="40" y="638" font-size="13" font-weight="400" fill="#888" text-anchor="start">(Aug 2026). Our arithmetic.</text>
