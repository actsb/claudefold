<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="The Dreo space heater in five minutes"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">The Dreo space heater in five minutes</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">From the Dreo support page for the DR-HSH004, in order</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Wall outlet only</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">No extension cord or power strip; a</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">shared outlet can trip.</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Place it flat</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">On a hard, level floor, 3 ft from</text><text x="440.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">anything that burns.</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Set the thermostat</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">41–95°F. Start at 68°F, then adjust.</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Pick a mode</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">ECO stops heating at the set temperature.</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Aim the oscillation</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">70° sweep; it pauses in ECO once warm.</text>
<rect x="800.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="340" r="20" fill="#1B2A41"/><text x="834.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="864.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Clean each season</text>
<text x="820.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Unplug, cool, dry cloth only: no</text><text x="820.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">detergents.</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">Sources: Dreo support page for DR-HSH004 (Oct 15, 2026); CPSC news release (Jan 23, 2026). The manual PDF itself could not be read.</text>
</g></svg>