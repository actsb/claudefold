<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Stuck in snow: what the official guidance says"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">Stuck in snow: what the official guidance says</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">Dig out first; if that fails, stay with the car</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Stop spinning</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Spinning digs you deeper and can overheat</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">the transmission.</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Clear the tailpipe</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">A blocked exhaust lets carbon monoxide</text><text x="440.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">build up inside, says the CDC.</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Dig out the drive wheels</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Clear snow in front of and behind them</text><text x="820.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">with the shovel.</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Put traction under the tires</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Sand, mats or even floor mats go in the</text><text x="60.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">path of the drive wheels.</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Still stuck? Stay in the car</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">NWS: leaving gets you disoriented fast.</text><text x="440.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">Call for help.</text>
<rect x="800.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="340" r="20" fill="#1B2A41"/><text x="834.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="864.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Heat in short runs</text>
<text x="820.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">NWS: run the motor about 10 minutes an</text><text x="820.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">hour, window cracked, exhaust clear.</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">Sources: National Weather Service 'During a Storm', CDC tailpipe page (updated August 2026), Minnesota State Patrol column (February 2026). Check your owner's manual before rocking the car.</text>
</g></svg>