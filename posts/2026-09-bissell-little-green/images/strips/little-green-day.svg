<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="The couch you thought was clean — a Saturday with the Little Green">
<rect width="1200" height="440" rx="18" fill="#F7F5F0"/>
<text x="24" y="40" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#1B2A41">The couch you thought was clean — a Saturday with the Little Green</text>
<text x="1176" y="40" text-anchor="end" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#888">in real life · 4 panels</text>
<rect x="20.0" y="62" width="276.5" height="358" rx="16" fill="#fff" stroke="#1B2A41" stroke-width="4"/>
<rect x="24.0" y="66" width="268.5" height="200.48000000000002" rx="12" fill="#DCE7F5"/>
<circle cx="50.0" cy="92" r="18" fill="#1B2A41"/><text x="50.0" y="99" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#fff">1</text>
<g transform="translate(88.25 106) scale(1.0)"><ellipse cx="66" cy="84" rx="40" ry="26" fill="#1B2A41"/><circle cx="104" cy="66" r="20" fill="#1B2A41"/><path d="M 92 50 l -8 -18 l 16 8 z M 116 50 l 8 -18 l -16 8 z" fill="#1B2A41"/><circle cx="110" cy="64" r="3" fill="#fff"/><path d="M 30 96 q -14 -6 -10 -22" stroke="#1B2A41" stroke-width="8" fill="none" stroke-linecap="round"/><rect x="44" y="104" width="10" height="20" fill="#1B2A41"/><rect x="80" y="104" width="10" height="20" fill="#1B2A41"/><path d="M 20 40 q 8 -12 16 0 q 8 -12 16 0" stroke="#C9781B" stroke-width="4" fill="none"/></g>
<text x="36.0" y="296.48" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#1B2A41">The dog. The couch. The stain.</text>
<text x="36.0" y="322.48" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#333">Vacuum the crumbs first. Fill</text>
<text x="36.0" y="343.48" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#333">the tank with warm water and</text>
<text x="36.0" y="364.48" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#333">formula.</text>
<rect x="314.5" y="62" width="276.5" height="358" rx="16" fill="#fff" stroke="#1B2A41" stroke-width="4"/>
<rect x="318.5" y="66" width="268.5" height="200.48000000000002" rx="12" fill="#E4F3EA"/>
<circle cx="344.5" cy="92" r="18" fill="#1B2A41"/><text x="344.5" y="99" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#fff">2</text>
<g transform="translate(382.75 106) scale(1.0)"><path d="M 16 70 L 70 22 L 124 70" fill="none" stroke="#1B2A41" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><rect x="32" y="66" width="76" height="56" rx="6" fill="#1B2A41"/><rect x="60" y="88" width="20" height="34" rx="3" fill="#F2C94C"/></g>
<text x="330.5" y="296.48" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#1B2A41">Spray, scrub, pull back slowly</text>
<text x="330.5" y="322.48" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#333">The dirty tank turns brown.</text>
<text x="330.5" y="343.48" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#333">That&#x27;s five years of &#x27;clean&#x27;</text>
<text x="330.5" y="364.48" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#333">cushions.</text>
<rect x="609.0" y="62" width="276.5" height="358" rx="16" fill="#fff" stroke="#1B2A41" stroke-width="4"/>
<rect x="613.0" y="66" width="268.5" height="200.48000000000002" rx="12" fill="#FBEBD2"/>
