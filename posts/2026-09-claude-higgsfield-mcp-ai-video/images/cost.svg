<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-label="What a fifteen-second AI product ad costs in credits, from stills to three clips and retries"><rect width="1200" height="690" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start" >What a 15-second ad really costs</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start" >One worked example in credits, with the numbers creators reported in 2026 (check today's plan page)</text>
<rect x="40" y="118" width="1120" height="40" rx="10" fill="#1B2A41"/>
<text x="60" y="144" font-size="15" font-weight="700" fill="#fff" text-anchor="start" >Step</text>
<text x="420" y="144" font-size="15" font-weight="700" fill="#fff" text-anchor="start" >Model</text>
<text x="640" y="144" font-size="15" font-weight="700" fill="#fff" text-anchor="start" >Credits</text>
<text x="760" y="144" font-size="15" font-weight="700" fill="#fff" text-anchor="start" >What it means</text>
<rect x="40" y="170" width="1120" height="50" rx="10" fill="#fff" stroke="#E3E1DB"/>
<text x="60" y="201" font-size="17" font-weight="700" fill="#1B2A41" text-anchor="start" >Plan and shot list</text>
<text x="420" y="201" font-size="16" font-weight="400" fill="#555" text-anchor="start" >Claude</text>
<text x="640" y="201" font-size="20" font-weight="800" fill="#1E8E5A" text-anchor="start" >0</text>
<text x="760" y="201" font-size="15" font-weight="400" fill="#333" text-anchor="start" >free at every tier of the workflow</text>
<rect x="40" y="228" width="1120" height="50" rx="10" fill="#fff" stroke="#E3E1DB"/>
<text x="60" y="259" font-size="17" font-weight="700" fill="#1B2A41" text-anchor="start" >6 test stills, 3 approved</text>
<text x="420" y="259" font-size="16" font-weight="400" fill="#555" text-anchor="start" >image model</text>
<text x="640" y="259" font-size="20" font-weight="800" fill="#1B2A41" text-anchor="start" >~30</text>
<ellipse cx="720" cy="262" rx="16" ry="6" fill="#C9781B" stroke="#1B2A41" stroke-width="1.2"/>
<text x="760" y="259" font-size="15" font-weight="400" fill="#333" text-anchor="start" >roughly 5 credits a frame; cheap enough to iterate</text>
<rect x="40" y="286" width="1120" height="50" rx="10" fill="#fff" stroke="#E3E1DB"/>
<text x="60" y="317" font-size="17" font-weight="700" fill="#1B2A41" text-anchor="start" >3 clips × 5 s, image-to-video</text>
<text x="420" y="317" font-size="16" font-weight="400" fill="#555" text-anchor="start" >Kling 3.0 via MCP</text>
<text x="640" y="317" font-size="20" font-weight="800" fill="#1B2A41" text-anchor="start" >75</text>
<ellipse cx="720" cy="320" rx="16" ry="6" fill="#C9781B" stroke="#1B2A41" stroke-width="1.2"/><ellipse cx="720" cy="314" rx="16" ry="6" fill="#C9781B" stroke="#1B2A41" stroke-width="1.2"/><ellipse cx="720" cy="308" rx="16" ry="6" fill="#C9781B" stroke="#1B2A41" stroke-width="1.2"/>
<text x="760" y="317" font-size="15" font-weight="400" fill="#333" text-anchor="start" >25 credits per 5-second clip in one creator's logged run</text>
<rect x="40" y="344" width="1120" height="50" rx="10" fill="#fff" stroke="#E3E1DB"/>
<text x="60" y="375" font-size="17" font-weight="700" fill="#1B2A41" text-anchor="start" >One retry per clip (plan for it)</text>
<text x="420" y="375" font-size="16" font-weight="400" fill="#555" text-anchor="start" >same</text>
<text x="640" y="375" font-size="20" font-weight="800" fill="#1B2A41" text-anchor="start" >75</text>
<ellipse cx="720" cy="378" rx="16" ry="6" fill="#C9781B" stroke="#1B2A41" stroke-width="1.2"/><ellipse cx="720" cy="372" rx="16" ry="6" fill="#C9781B" stroke="#1B2A41" stroke-width="1.2"/><ellipse cx="720" cy="366" rx="16" ry="6" fill="#C9781B" stroke="#1B2A41" stroke-width="1.2"/>
<text x="760" y="375" font-size="15" font-weight="400" fill="#333" text-anchor="start" >a failed generation costs the same as a good one</text>
<rect x="40" y="402" width="1120" height="50" rx="10" fill="#fff" stroke="#E3E1DB"/>
<text x="60" y="433" font-size="17" font-weight="700" fill="#1B2A41" text-anchor="start" >Narration line</text>
<text x="420" y="433" font-size="16" font-weight="400" fill="#555" text-anchor="start" >voice model</text>
<text x="640" y="433" font-size="20" font-weight="800" fill="#1B2A41" text-anchor="start" >~5</text>
<ellipse cx="720" cy="436" rx="16" ry="6" fill="#C9781B" stroke="#1B2A41" stroke-width="1.2"/>
<text x="760" y="433" font-size="15" font-weight="400" fill="#333" text-anchor="start" >or record it yourself for free</text>
<rect x="40" y="468" width="1120" height="84" rx="10" fill="#1E8E5A"/>
<text x="60" y="504" font-size="22" font-weight="800" fill="#fff" text-anchor="start" >Total: about 185 credits for one finished 15-second ad</text>
<text x="60" y="532" font-size="15" font-weight="400" fill="#E6F4EC" text-anchor="start" >About $12 bought as prepaid credits at the rate seen in September 2026, or roughly a fifth of the mid-tier monthly plan.</text>
<rect x="40" y="570" width="1120" height="64" rx="16" fill="#FFF6E3" stroke="#F0D9A8"/>
<path d="M 70 590 l 12 21 h -24 z" fill="#C9781B"/><rect x="68.7" y="597" width="2.6" height="8" rx="1.3" fill="#fff"/><circle cx="70" cy="608" r="1.6" fill="#fff"/>
<text x="92" y="595" font-size="15" font-weight="400" fill="#333" text-anchor="start" >Credits per generation depend on the model and resolution and change without notice; Higgsfield renamed its plans twice</text><text x="92" y="615" font-size="15" font-weight="400" fill="#333" text-anchor="start" >in 2026. Run one clip, read what it cost in your history, then multiply. Never buy an annual plan before that.</text>
<text x="40" y="668" font-size="13" font-weight="400" fill="#888" text-anchor="start" >Per-clip figure from a creator's published run log (Kling 3.0, 5 s, June 2026); still and voice estimates rounded from Higgsfield's model pricing pages. Your plan page shows the current rates.</text>
</g></svg>