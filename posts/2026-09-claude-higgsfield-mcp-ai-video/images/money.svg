<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Four ways creators get paid for this workflow, and what each one requires"><rect width="1200" height="640" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start" >Who pays for the video: the four routes creators describe</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start" >No income figures here on purpose. Each route has a gate you must clear first.</text>
<rect x="40" y="112" width="550" height="232" rx="16" fill="#fff" stroke="#E3E1DB"/>
<rect x="40" y="112" width="550" height="46" rx="16" fill="#C9781B"/><rect x="40" y="136" width="550" height="22" fill="#C9781B"/>
<text x="58" y="143" font-size="20" font-weight="800" fill="#fff" text-anchor="start" >1 · A client pays per video</text>
<text x="58" y="186" font-size="15" font-weight="400" fill="#333" text-anchor="start" >Local shops, medical practices, restaurants: a 15-second ad or</text><text x="58" y="206" font-size="15" font-weight="400" fill="#333" text-anchor="start" >a product detail page. The Korean tutorials are built around</text><text x="58" y="226" font-size="15" font-weight="400" fill="#333" text-anchor="start" >this.</text>
<circle cx="68" cy="262" r="9" fill="#C9781B"/><path d="M 63 262 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="86" y="267" font-size="15" font-weight="600" fill="#333" text-anchor="start" >Client's product, client's brief</text>
<circle cx="68" cy="288" r="9" fill="#C9781B"/><path d="M 63 288 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="86" y="293" font-size="15" font-weight="600" fill="#333" text-anchor="start" >Written approval of the plan before you spend credits</text>
<circle cx="68" cy="314" r="9" fill="#C9781B"/><path d="M 63 314 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="86" y="319" font-size="15" font-weight="600" fill="#333" text-anchor="start" >Keep the generation log as your delivery record</text>
<rect x="610" y="112" width="550" height="232" rx="16" fill="#fff" stroke="#E3E1DB"/>
<rect x="610" y="112" width="550" height="46" rx="16" fill="#1E8E5A"/><rect x="610" y="136" width="550" height="22" fill="#1E8E5A"/>
<text x="628" y="143" font-size="20" font-weight="800" fill="#fff" text-anchor="start" >2 · Your own listing sells more</text>
<text x="628" y="186" font-size="15" font-weight="400" fill="#333" text-anchor="start" >Amazon, Etsy or Shopify sellers make listing videos, lifestyle</text><text x="628" y="206" font-size="15" font-weight="400" fill="#333" text-anchor="start" >shots and marketplace cards for products they already sell.</text>
<circle cx="638" cy="262" r="9" fill="#1E8E5A"/><path d="M 633 262 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="656" y="267" font-size="15" font-weight="600" fill="#333" text-anchor="start" >Only the product you sell, shown as it is</text>
<circle cx="638" cy="288" r="9" fill="#1E8E5A"/><path d="M 633 288 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="656" y="293" font-size="15" font-weight="600" fill="#333" text-anchor="start" >No invented features, no fake reviews</text>
<circle cx="638" cy="314" r="9" fill="#1E8E5A"/><path d="M 633 314 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="656" y="319" font-size="15" font-weight="600" fill="#333" text-anchor="start" >Amazon's video rules still apply to AI clips</text>
<rect x="40" y="362" width="550" height="232" rx="16" fill="#fff" stroke="#E3E1DB"/>
<rect x="40" y="362" width="550" height="46" rx="16" fill="#7C5CFF"/><rect x="40" y="386" width="550" height="22" fill="#7C5CFF"/>
<text x="58" y="393" font-size="20" font-weight="800" fill="#fff" text-anchor="start" >3 · A platform pays for views</text>
<text x="58" y="436" font-size="15" font-weight="400" fill="#333" text-anchor="start" >YouTube Partner Program: 1,000 subscribers plus 4,000 watch</text><text x="58" y="456" font-size="15" font-weight="400" fill="#333" text-anchor="start" >hours or 10 million Shorts views, then the July 2025</text><text x="58" y="476" font-size="15" font-weight="400" fill="#333" text-anchor="start" >"inauthentic content" rule decides if AI clips qualify.</text>
<circle cx="68" cy="512" r="9" fill="#7C5CFF"/><path d="M 63 512 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="86" y="517" font-size="15" font-weight="600" fill="#333" text-anchor="start" >Original narrative, editing and voice each video</text>
<circle cx="68" cy="538" r="9" fill="#7C5CFF"/><path d="M 63 538 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="86" y="543" font-size="15" font-weight="600" fill="#333" text-anchor="start" >Label altered or synthetic content on upload</text>
<circle cx="68" cy="564" r="9" fill="#7C5CFF"/><path d="M 63 564 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="86" y="569" font-size="15" font-weight="600" fill="#333" text-anchor="start" >Higgsfield's own creator campaigns are a separate pool</text>
<rect x="610" y="362" width="550" height="232" rx="16" fill="#fff" stroke="#E3E1DB"/>
<rect x="610" y="362" width="550" height="46" rx="16" fill="#1B2A41"/><rect x="610" y="386" width="550" height="22" fill="#1B2A41"/>
<text x="628" y="393" font-size="20" font-weight="800" fill="#fff" text-anchor="start" >4 · Referrals pay a share</text>
<text x="628" y="436" font-size="15" font-weight="400" fill="#333" text-anchor="start" >Reviewers and teachers earn a commission when a reader</text><text x="628" y="456" font-size="15" font-weight="400" fill="#333" text-anchor="start" >subscribes through their link: Higgsfield up to 25% for 12</text><text x="628" y="476" font-size="15" font-weight="400" fill="#333" text-anchor="start" >months, ElevenLabs 22%, most others 20–30%.</text>
<circle cx="638" cy="512" r="9" fill="#1B2A41"/><path d="M 633 512 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="656" y="517" font-size="15" font-weight="600" fill="#333" text-anchor="start" >Disclose before the link, in plain words</text>
<circle cx="638" cy="538" r="9" fill="#1B2A41"/><path d="M 633 538 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="656" y="543" font-size="15" font-weight="600" fill="#333" text-anchor="start" >First-hand use, original clips, honest drawbacks</text>
<circle cx="638" cy="564" r="9" fill="#1B2A41"/><path d="M 633 564 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="656" y="569" font-size="15" font-weight="600" fill="#333" text-anchor="start" >No earnings promises; attribute every number</text>
<text x="40" y="618" font-size="13" font-weight="400" fill="#888" text-anchor="start" >Program terms as published in September 2026 and subject to change; YouTube thresholds from the Partner Program page. Reported creator incomes are marketing claims and are not shown.</text>
</g></svg>