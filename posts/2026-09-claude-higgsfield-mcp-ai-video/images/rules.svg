<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Twelve rules that keep an AI product video legal in the United States: disclosure, likeness, licences, labels"><rect width="1200" height="700" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start" >Before you publish an AI ad: the twelve-line checklist</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start" >US rules as of September 2026; the ones the FTC, the platforms and the tool licences actually enforce</text>
<rect x="40" y="108" width="550" height="78" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="66" cy="134" r="11" fill="#1E8E5A"/><path d="M 61 134 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="86" y="139" font-size="17" font-weight="800" fill="#1B2A41" text-anchor="start" >Disclose paid links before the click</text>
<text x="86" y="162" font-size="13.5" font-weight="400" fill="#444" text-anchor="start" >FTC Endorsement Guides: "paid link" or "I earn a commission", near the link,</text><text x="86" y="179" font-size="13.5" font-weight="400" fill="#444" text-anchor="start" >not only in a footer.</text>
<rect x="610" y="108" width="550" height="78" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="636" cy="134" r="11" fill="#1E8E5A"/><path d="M 631 134 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="656" y="139" font-size="17" font-weight="800" fill="#1B2A41" text-anchor="start" >No fake or AI-written reviews</text>
<text x="656" y="162" font-size="13.5" font-weight="400" fill="#444" text-anchor="start" >FTC rule effective Oct 21, 2024; civil penalties per violation. An AI avatar</text><text x="656" y="179" font-size="13.5" font-weight="400" fill="#444" text-anchor="start" >is not a customer.</text>
<rect x="40" y="198" width="550" height="78" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="66" cy="224" r="11" fill="#1E8E5A"/><path d="M 61 224 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="86" y="229" font-size="17" font-weight="800" fill="#1B2A41" text-anchor="start" >No earnings promises</text>
<text x="86" y="252" font-size="13.5" font-weight="400" fill="#444" text-anchor="start" >"Creators report" with a source and a date; never "you will make". Typical</text><text x="86" y="269" font-size="13.5" font-weight="400" fill="#444" text-anchor="start" >results, if any, must be substantiated.</text>
<rect x="610" y="198" width="550" height="78" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="636" cy="224" r="11" fill="#1E8E5A"/><path d="M 631 224 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="656" y="229" font-size="17" font-weight="800" fill="#1B2A41" text-anchor="start" >Label synthetic media where the platform asks</text>
<text x="656" y="252" font-size="13.5" font-weight="400" fill="#444" text-anchor="start" >YouTube's altered-or-synthetic disclosure on upload; TikTok and Meta have</text><text x="656" y="269" font-size="13.5" font-weight="400" fill="#444" text-anchor="start" >their own labels.</text>
<rect x="40" y="288" width="550" height="78" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="66" cy="314" r="11" fill="#1E8E5A"/><path d="M 61 314 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="86" y="319" font-size="17" font-weight="800" fill="#1B2A41" text-anchor="start" >Never generate a real person's face or voice</text>
<text x="86" y="342" font-size="13.5" font-weight="400" fill="#444" text-anchor="start" >State right-of-publicity laws (Tennessee's ELVIS Act among them) and the</text><text x="86" y="359" font-size="13.5" font-weight="400" fill="#444" text-anchor="start" >federal TAKE IT DOWN Act; use invented characters.</text>
<rect x="610" y="288" width="550" height="78" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="636" cy="314" r="11" fill="#1E8E5A"/><path d="M 631 314 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="656" y="319" font-size="17" font-weight="800" fill="#1B2A41" text-anchor="start" >Commercial rights come with the paid tier</text>
<text x="656" y="342" font-size="13.5" font-weight="400" fill="#444" text-anchor="start" >Free tiers of Kling, Runway, HeyGen and ElevenLabs are watermarked or</text><text x="656" y="359" font-size="13.5" font-weight="400" fill="#444" text-anchor="start" >non-commercial; keep the invoice.</text>
<rect x="40" y="378" width="550" height="78" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="66" cy="404" r="11" fill="#1E8E5A"/><path d="M 61 404 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="86" y="409" font-size="17" font-weight="800" fill="#1B2A41" text-anchor="start" >Own the music</text>
<text x="86" y="432" font-size="13.5" font-weight="400" fill="#444" text-anchor="start" >Synthesize it, license it, or use the tool's licensed library; YouTube's audio</text><text x="86" y="449" font-size="13.5" font-weight="400" fill="#444" text-anchor="start" >library is for YouTube only.</text>
<rect x="610" y="378" width="550" height="78" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="636" cy="404" r="11" fill="#1E8E5A"/><path d="M 631 404 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="656" y="409" font-size="17" font-weight="800" fill="#1B2A41" text-anchor="start" >Say what is AI in the ad itself</text>
<text x="656" y="432" font-size="13.5" font-weight="400" fill="#444" text-anchor="start" >"Generated with Higgsfield" in the caption. New York's synthetic-performer law</text><text x="656" y="449" font-size="13.5" font-weight="400" fill="#444" text-anchor="start" >reaches ads from 2026.</text>
<rect x="40" y="468" width="550" height="78" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="66" cy="494" r="11" fill="#1E8E5A"/><path d="M 61 494 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="86" y="499" font-size="17" font-weight="800" fill="#1B2A41" text-anchor="start" >Show the product as it is</text>
<text x="86" y="522" font-size="13.5" font-weight="400" fill="#444" text-anchor="start" >No invented features or sizes; the FTC's truth-in-advertising standard applies</text><text x="86" y="539" font-size="13.5" font-weight="400" fill="#444" text-anchor="start" >to synthetic footage.</text>
<rect x="610" y="468" width="550" height="78" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="636" cy="494" r="11" fill="#1E8E5A"/><path d="M 631 494 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="656" y="499" font-size="17" font-weight="800" fill="#1B2A41" text-anchor="start" >Keep the generation log</text>
<text x="656" y="522" font-size="13.5" font-weight="400" fill="#444" text-anchor="start" >Prompts, dates, model names and credit receipts; the record that answers a</text><text x="656" y="539" font-size="13.5" font-weight="400" fill="#444" text-anchor="start" >client, a platform or a regulator.</text>
<rect x="40" y="558" width="550" height="78" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="66" cy="584" r="11" fill="#1E8E5A"/><path d="M 61 584 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="86" y="589" font-size="17" font-weight="800" fill="#1B2A41" text-anchor="start" >Embed, never re-upload, other creators' videos</text>
<text x="86" y="612" font-size="13.5" font-weight="400" fill="#444" text-anchor="start" >YouTube's player is licensed for embedding; downloading or re-hosting a video</text><text x="86" y="629" font-size="13.5" font-weight="400" fill="#444" text-anchor="start" >is not.</text>
<rect x="610" y="558" width="550" height="78" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="636" cy="584" r="11" fill="#1E8E5A"/><path d="M 631 584 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="656" y="589" font-size="17" font-weight="800" fill="#1B2A41" text-anchor="start" >Name tools, don't borrow their logos</text>
<text x="656" y="612" font-size="13.5" font-weight="400" fill="#444" text-anchor="start" >Nominative use of Claude, Higgsfield or Kling is fine; their logos and any</text><text x="656" y="629" font-size="13.5" font-weight="400" fill="#444" text-anchor="start" >hint of endorsement are not.</text>
<text x="40" y="678" font-size="13" font-weight="400" fill="#888" text-anchor="start" >Summarised from the FTC Endorsement Guides (2023), the Consumer Reviews and Testimonials Rule (2024), YouTube's policies, state publicity laws and the tools' terms. Not legal advice.</text>
</g></svg>