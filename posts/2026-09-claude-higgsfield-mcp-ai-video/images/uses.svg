<text x="40" y="678" font-size="13" font-weight="400" fill="#888" text-anchor="start" >Jobs 1–3, 6–7 and 10 are the community pack's skills; 4–5, 8–9 and 11–13 are Higgsfield's official skills repo (github.com/higgsfield-ai/skills). Counted once each.</text>
