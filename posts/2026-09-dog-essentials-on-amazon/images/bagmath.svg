<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Poop-bag math for one dog: about 730 bags a year; cost per year by brand"><rect width="1200" height="460" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start" >Poop-bag math, one dog, one year</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start" >Two bags a day, every day: about 60 a month, 730 a year. Here is what that costs per brand at the prices we found.</text>
<text x="454" y="142" font-size="15" font-weight="700" fill="#1B2A41" text-anchor="end" >Amazon Basics 900-count (Amazon only)</text>
<rect x="470" y="120" width="100.71428571428571" height="34" rx="8" fill="#1E8E5A" opacity="0.9"/>
<text x="582.7142857142857" y="143" font-size="15" font-weight="700" fill="#1B2A41" text-anchor="start" >1.5¢ a bag · about $11 a year</text>
<text x="454" y="200" font-size="15" font-weight="700" fill="#1B2A41" text-anchor="end" >Earth Rated 270-count on Amazon, with Subscribe &amp; Save</text>
<rect x="470" y="178" width="221.57142857142858" height="34" rx="8" fill="#1E8E5A" opacity="0.9"/>
<text x="703.5714285714286" y="201" font-size="15" font-weight="700" fill="#1B2A41" text-anchor="start" >3.3¢ a bag · about $24 a year</text>
<text x="454" y="258" font-size="15" font-weight="700" fill="#1B2A41" text-anchor="end" >Pogi's 300 with handles (one-handed tying)</text>
<rect x="470" y="236" width="322.2857142857143" height="34" rx="8" fill="#C9781B" opacity="0.9"/>
<text x="804.2857142857142" y="259" font-size="15" font-weight="700" fill="#1B2A41" text-anchor="start" >4.8¢ a bag · about $35 a year</text>
<text x="454" y="316" font-size="15" font-weight="700" fill="#1B2A41" text-anchor="end" >Earth Rated 270-count at Chewy ($14.99)</text>
<rect x="470" y="294" width="362.57142857142856" height="34" rx="8" fill="#C9781B" opacity="0.9"/>
<text x="844.5714285714286" y="317" font-size="15" font-weight="700" fill="#1B2A41" text-anchor="start" >5.4¢ a bag · about $39 a year</text>
<text x="454" y="374" font-size="15" font-weight="700" fill="#1B2A41" text-anchor="end" >Pogi's compostable 270</text>
<rect x="470" y="352" width="449.85714285714283" height="34" rx="8" fill="#1B2A41" opacity="0.9"/>
<text x="931.8571428571429" y="375" font-size="15" font-weight="700" fill="#1B2A41" text-anchor="start" >6.7¢ a bag · about $49 a year</text>
<text x="40" y="420" font-size="13" font-weight="400" fill="#777" text-anchor="start" >Per-bag prices from September 2026 listings and deal snippets; counts assume two bags a day, 365 days.</text>
<text x="40" y="442" font-size="13" font-weight="400" fill="#777" text-anchor="start" >Earth Rated won CNN Underscored's eight-brand 2026 test; Amazon Basics was the only other bag to survive its asphalt-scoop test.</text>
</g></svg>