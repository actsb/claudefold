<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="How to fit a no-pull harness: two-finger rule, strap positions, front clip vs back clip"><rect width="1200" height="620" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start" >Fit it once, properly</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start" >The four checks that stop a spitz-type dog from backing out of a harness.</text>
<rect x="40" y="108" width="560" height="470" rx="16" fill="#fff" stroke="#e3e1db"/>
<g transform="translate(150 520) scale(1.15)"><path d="M 40 -120 Q 20 -190 90 -196 L 250 -196 Q 300 -196 300 -150 L 300 -120 Q 300 -90 270 -84 L 250 -84 L 250 -10 L 226 -10 L 226 -70 L 120 -70 L 120 -10 L 96 -10 L 96 -84 Q 40 -84 40 -120 Z" fill="#8B6B43"/><path d="M 296 -190 q 40 -40 20 -80 q -6 40 -34 60" fill="#8B6B43"/><path d="M 90 -196 Q 60 -250 10 -236 L -20 -216 Q -34 -206 -20 -196 L 40 -186 Q 60 -180 90 -196 Z" fill="#8B6B43"/><path d="M 34 -236 l -6 -40 l 30 26 z M 66 -230 l 6 -40 l 20 34 z" fill="#6d4d25"/><circle cx="8" cy="-224" r="4" fill="#222"/><circle cx="-18" cy="-206" r="5" fill="#222"/><path d="M 92 -140 Q 60 -150 48 -170" fill="none" stroke="#1B2A41" stroke-width="12" stroke-linecap="round"/><path d="M 150 -196 L 150 -90" fill="none" stroke="#1B2A41" stroke-width="12" stroke-linecap="round"/><path d="M 100 -196 Q 130 -206 160 -196" fill="none" stroke="#1B2A41" stroke-width="14" stroke-linecap="round"/><path d="M 92 -140 L 150 -150" fill="none" stroke="#1B2A41" stroke-width="10" stroke-linecap="round"/><circle cx="132" cy="-208" r="8" fill="none" stroke="#B9BEC6" stroke-width="4"/><circle cx="86" cy="-142" r="7" fill="none" stroke="#B9BEC6" stroke-width="4"/></g>
<circle cx="536" cy="178" r="16" fill="#1E8E5A"/><text x="536" y="184" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >2</text>
<circle cx="536" cy="268" r="16" fill="#1E8E5A"/><text x="536" y="274" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >3</text>
<circle cx="536" cy="358" r="16" fill="#1E8E5A"/><text x="536" y="364" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >1</text>
<circle cx="536" cy="448" r="16" fill="#1E8E5A"/><text x="536" y="454" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >4</text>
<circle cx="246" cy="282" r="15" fill="#1E8E5A" stroke="#fff" stroke-width="3"/><text x="246" y="288" font-size="16" font-weight="800" fill="#fff" text-anchor="middle" >2</text>
<circle cx="322" cy="350" r="15" fill="#1E8E5A" stroke="#fff" stroke-width="3"/><text x="322" y="356" font-size="16" font-weight="800" fill="#fff" text-anchor="middle" >3</text>
<circle cx="240" cy="386" r="15" fill="#1E8E5A" stroke="#fff" stroke-width="3"/><text x="240" y="392" font-size="16" font-weight="800" fill="#fff" text-anchor="middle" >1</text>
<circle cx="250" cy="460" r="15" fill="#1E8E5A" stroke="#fff" stroke-width="3"/><text x="250" y="466" font-size="16" font-weight="800" fill="#fff" text-anchor="middle" >4</text>
<rect x="640" y="108" width="520" height="470" rx="16" fill="#fff" stroke="#e3e1db"/>
<text x="664" y="150" font-size="22" font-weight="800" fill="#1B2A41" text-anchor="start" >The four checks</text>
<circle cx="676" cy="180" r="11" fill="#1E8E5A"/><path d="M 671 180 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="698" y="186" font-size="19" font-weight="700" fill="#1B2A41" text-anchor="start" >Two fingers, not a fist</text>
<text x="698" y="210" font-size="16" font-weight="400" fill="#333" text-anchor="start" >If your hand slides under the girth strap, the dog</text>
<text x="698" y="232" font-size="16" font-weight="400" fill="#333" text-anchor="start" >can too. Snug enough to stay put, loose enough to</text>
<text x="698" y="254" font-size="16" font-weight="400" fill="#333" text-anchor="start" >breathe.</text>
<circle cx="676" cy="276" r="11" fill="#1E8E5A"/><path d="M 671 276 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="698" y="282" font-size="19" font-weight="700" fill="#1B2A41" text-anchor="start" >Straps off the armpits</text>
<text x="698" y="306" font-size="16" font-weight="400" fill="#333" text-anchor="start" >The girth strap should sit a hand's width behind the</text>
<text x="698" y="328" font-size="16" font-weight="400" fill="#333" text-anchor="start" >front legs. Rubbing means it is too far forward.</text>
<circle cx="676" cy="372" r="11" fill="#1E8E5A"/><path d="M 671 372 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="698" y="378" font-size="19" font-weight="700" fill="#1B2A41" text-anchor="start" >Front clip on days that pull</text>
<text x="698" y="402" font-size="16" font-weight="400" fill="#333" text-anchor="start" >The chest ring turns a lunge into a sideways step.</text>
<text x="698" y="424" font-size="16" font-weight="400" fill="#333" text-anchor="start" >Switch to the back ring once the dog walks nicely.</text>
<circle cx="676" cy="468" r="11" fill="#1E8E5A"/><path d="M 671 468 l 4 4 l 7 -8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="698" y="474" font-size="19" font-weight="700" fill="#1B2A41" text-anchor="start" >The escape test</text>
<text x="698" y="498" font-size="16" font-weight="400" fill="#333" text-anchor="start" >Spitz dogs (Jindos, huskies, shibas) back out of</text>
<text x="698" y="520" font-size="16" font-weight="400" fill="#333" text-anchor="start" >loose harnesses. Before the walk, hold the leash and</text>
<text x="698" y="542" font-size="16" font-weight="400" fill="#333" text-anchor="start" >step back: if the harness slides toward the ears,</text>
<text x="698" y="564" font-size="16" font-weight="400" fill="#333" text-anchor="start" >tighten the girth.</text>
<text x="40" y="606" font-size="15" font-weight="400" fill="#777" text-anchor="start" >Sizing: measure the widest part of the chest, then pick the size whose range puts that number in the middle, not at the edge.</text>
</g></svg>