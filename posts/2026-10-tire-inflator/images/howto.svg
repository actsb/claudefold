<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Fill a tire with a cordless inflator in five minutes"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">Fill a tire with a cordless inflator in five minutes</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">The number to use is on the door placard, not on the tire</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Check tires cold</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Before driving, or after the car has sat</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">for three hours. Warm tires read 4–6 psi</text><text x="60.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">high.</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Find the placard number</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Door-edge label or owner's manual. The</text><text x="440.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">sidewall figure is the tire's maximum,</text><text x="440.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">not your target.</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Charge or fit the battery</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Built-in batteries: charge first.</text><text x="820.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">Tool-only pumps need a charged 18V/20V or</text><text x="820.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">12V pack.</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Screw on the chuck</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Thread the hose onto the valve fast and</text><text x="60.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">fully; a hiss means it is not seated.</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Set the target and start</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Dial in the placard psi. Auto-stop shuts</text><text x="440.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">the motor off at that number.</text>
<rect x="800.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="340" r="20" fill="#1B2A41"/><text x="834.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="864.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Verify and rest the pump</text>
<text x="820.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Confirm with a handheld gauge, then let</text><text x="820.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">the pump cool: Milwaukee asks for 40</text><text x="820.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">minutes after 20 of use.</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">Sources: NHTSA tire-safety guidance (via search summaries, October 2026); Milwaukee and DeWalt manuals. Always follow your pump's manual.</text>
</g></svg>