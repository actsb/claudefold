<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="The O-Cedar spin mop in five minutes"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">The O-Cedar spin mop in five minutes</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">Six steps from box to dry floor, from O-Cedar's use-and-care guidance and owner tips</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Assemble and lock</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Twist the handle sections together and</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">lock the length. Press the head onto the</text><text x="60.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">frame until it clicks.</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Fill the bucket</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Water up to the line, plus any floor</text><text x="440.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">cleaner you like. Sealed floors only.</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Dunk, then spin</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Put the head in the basket and pump the</text><text x="820.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">pedal 5 to 7 times (O-Cedar). More pumps</text><text x="820.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">for hardwood.</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Mop in lines</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Work back toward the door. Rinse and</text><text x="60.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">re-wring when the head turns grey.</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Pop the head off</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Step on it to detach, so your hands stay</text><text x="440.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">clean.</text>
<rect x="800.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="340" r="20" fill="#1B2A41"/><text x="834.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="864.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Wash and dry flat</text>
<text x="820.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Machine or hand wash, no bleach or fabric</text><text x="820.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">softener, air dry. Replace about every 3</text><text x="820.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">months.</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">Sources: O-Cedar use-and-care and washing pages (as seen in search snippets; read your own manual).</text>
</g></svg>