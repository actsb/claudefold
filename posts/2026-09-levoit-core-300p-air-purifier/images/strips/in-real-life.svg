<text x="330.5" y="296.48" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#1B2A41">12 minutes per air change</text>
<text x="330.5" y="322.48" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#333">On high it turns a 219 sq ft</text>
<text x="330.5" y="343.48" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#333">room over about 4.8 times an</text>
<text x="330.5" y="364.48" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#333">hour (Levoit&#x27;s spec). One room,</text>
<text x="330.5" y="385.48" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#333">one unit.</text>
