<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="The Levoit Core 300-P in five minutes"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">The Levoit Core 300-P in five minutes</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">From the box to clean air in six steps, taken from the manual and Levoit's own guides</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Unwrap the filter first</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Twist off the base cover, pull the filter</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">out, remove the plastic bag it ships in,</text><text x="60.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">and seat it back in. Running it wrapped</text><text x="60.0" y="248" font-size="15" font-weight="400" fill="#333" text-anchor="start">is a common cause of a rattle.</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Give it 15 inches of space</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">The manual asks for 15 in (38 cm) of</text><text x="440.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">clearance on every side. It pulls air in</text><text x="440.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">around the bottom and blows it out the</text><text x="440.0" y="248" font-size="15" font-weight="400" fill="#333" text-anchor="start">top, so not in a corner, not under a</text><text x="440.0" y="268" font-size="15" font-weight="400" fill="#333" text-anchor="start">shelf.</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">One room, door closed</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Sized for about 219 sq ft at 4.8 air</text><text x="820.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">changes an hour. Put it where you spend</text><text x="820.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">the most hours, usually the bedroom, and</text><text x="820.0" y="248" font-size="15" font-weight="400" fill="#333" text-anchor="start">keep the door shut.</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">High by day, Sleep at night</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Speed 3 cleans fastest; Sleep mode is the</text><text x="60.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">quiet setting (24 dB by Levoit's spec).</text><text x="60.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">Tap the display button so the panel light</text><text x="60.0" y="442" font-size="15" font-weight="400" fill="#333" text-anchor="start">goes dark at night.</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Vacuum the outside monthly</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">The mesh pre-filter is the outer layer of</text><text x="440.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">the cylinder. A gentle pass with the</text><text x="440.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">vacuum brush every 1–3 months keeps</text><text x="440.0" y="442" font-size="15" font-weight="400" fill="#333" text-anchor="start">airflow up. Never wash the filter.</text>
<rect x="800.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="340" r="20" fill="#1B2A41"/><text x="834.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="864.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">New filter at 6–8 months</text>
<text x="820.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">When the Check Filter light comes on, fit</text><text x="820.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">a genuine Core 300-RF, then hold the</text><text x="820.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">button 3 seconds until the light goes</text><text x="820.0" y="442" font-size="15" font-weight="400" fill="#333" text-anchor="start">out. It is a timer, not a sensor.</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">Sources: Levoit Core 300 user manual; Levoit's filter, maintenance and room-size guides; EPA wildfire filtration factsheet (June 2026).</text>
</g></svg>