<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="The Furhaven dog bed in five minutes"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">The Furhaven dog bed in five minutes</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">From Furhaven's FAQ and care page, in order</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Measure your dog</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Lying in the usual sleep pose. Large is</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">36 x 27 in.</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Unbox and wait</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">It ships compressed. Give it a few days</text><text x="440.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">to expand.</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Place it well</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Warm, draft-free spot, non-slip floor</text><text x="820.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">under it (VCA).</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Wash the cover</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Unzip, cold wash, gentle cycle, then air</text><text x="60.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">dry.</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Spot-clean the foam</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Damp cloth and mild soap. Never machine</text><text x="440.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">wash it.</text>
<rect x="800.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="340" r="20" fill="#1B2A41"/><text x="834.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="864.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Check at six months</text>
<text x="820.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">If your dog bottoms out, size up or</text><text x="820.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">replace.</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">Sources: furhaven.com FAQ and care blog (Jan 26, 2024), read Oct 19, 2026; VCA Hospitals (Jun 2026). The skipped step is the three-day wait.</text>
</g></svg>