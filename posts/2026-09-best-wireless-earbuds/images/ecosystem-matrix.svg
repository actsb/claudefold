<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="Which earbuds unlock their full features on which phone">
<rect width="1000" height="620" fill="#fff"/>
<g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1B2A41">The ecosystem trap: which earbuds give you everything on your phone</text>
<text x="500" y="58" text-anchor="middle" font-size="13" fill="#555">● full feature set  ◐ works, but loses headline features  ○ basic audio only</text>
<g font-size="13" fill="#1B2A41">
<rect x="30" y="80" width="940" height="36" fill="#F7F5F0"/>
<text x="40" y="104" font-weight="700">Earbuds</text><text x="380" y="104" font-weight="700" text-anchor="middle">iPhone</text><text x="530" y="104" font-weight="700" text-anchor="middle">Galaxy</text><text x="680" y="104" font-weight="700" text-anchor="middle">Pixel / other Android</text><text x="860" y="104" font-weight="700" text-anchor="middle">Windows / Mac</text>
<g font-size="20" text-anchor="middle">
<text x="40" y="146" font-size="13" text-anchor="start">AirPods 5 / AirPods Pro 3</text><text x="380" y="151">●</text><text x="530" y="151">◐</text><text x="680" y="151">◐</text><text x="860" y="151">◐</text>
<text x="40" y="186" font-size="13" text-anchor="start">Beats Powerbeats Pro 2</text><text x="380" y="191">●</text><text x="530" y="191">◐</text><text x="680" y="191">◐</text><text x="860" y="191">◐</text>
<text x="40" y="226" font-size="13" text-anchor="start">Samsung Galaxy Buds4 Pro</text><text x="380" y="231">○</text><text x="530" y="231">●</text><text x="680" y="231">◐</text><text x="860" y="231">◐</text>
<text x="40" y="266" font-size="13" text-anchor="start">Google Pixel Buds Pro 2 / 2a</text><text x="380" y="271">○</text><text x="530" y="271">◐</text><text x="680" y="271">●</text><text x="860" y="271">◐</text>
<text x="40" y="306" font-size="13" text-anchor="start">Sony WF-1000XM6</text><text x="380" y="311">●</text><text x="530" y="311">●</text><text x="680" y="311">●</text><text x="860" y="311">●</text>
<text x="40" y="346" font-size="13" text-anchor="start">Bose QC Ultra Earbuds (2nd Gen)</text><text x="380" y="351">●</text><text x="530" y="351">●</text><text x="680" y="351">●</text><text x="860" y="351">●</text>
<text x="40" y="386" font-size="13" text-anchor="start">Technics AZ100 · Sennheiser MTW4 · Nothing Ear (3)</text><text x="380" y="391">●</text><text x="530" y="391">●</text><text x="680" y="391">●</text><text x="860" y="391">●</text>
<text x="40" y="426" font-size="13" text-anchor="start">Soundcore · EarFun · JLab (budget)</text><text x="380" y="431">●</text><text x="530" y="431">●</text><text x="680" y="431">●</text><text x="860" y="431">●</text>
</g>
<g stroke="#eee"><line x1="30" y1="160" x2="970" y2="160"/><line x1="30" y1="200" x2="970" y2="200"/><line x1="30" y1="240" x2="970" y2="240"/><line x1="30" y1="280" x2="970" y2="280"/><line x1="30" y1="320" x2="970" y2="320"/><line x1="30" y1="360" x2="970" y2="360"/><line x1="30" y1="400" x2="970" y2="400"/><line x1="30" y1="440" x2="970" y2="440"/></g>
</g>
<rect x="30" y="460" width="940" height="140" rx="10" fill="#F7F5F0"/>
<g font-size="13" fill="#222">
<text x="50" y="488" font-weight="700" fill="#1B2A41">What you lose off-platform</text>
<text x="50" y="512">• AirPods on Android: no Adaptive Audio, Conversation Awareness, hearing features, Find My, fit test, or firmware updates.</text>
<text x="50" y="534">• Galaxy Buds on iPhone: no app at all — no ANC adjustment, no EQ, no 360 Audio, no Galaxy AI translation.</text>
<text x="50" y="556">• Pixel Buds on iPhone: no app, no Gemini, no Find My Device. On Galaxy: works, minus some Pixel-only tricks.</text>
<text x="50" y="578">• Sony, Bose, Technics, Sennheiser, Nothing, Soundcore, EarFun: the same app and features on every phone — the safe choice if you switch platforms.</text>
</g>
</g>
</svg>
