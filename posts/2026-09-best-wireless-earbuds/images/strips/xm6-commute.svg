<text x="625.0" y="296.48" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#1B2A41">3 min in the case = 1 hour</text>
<text x="625.0" y="322.48" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#333">Forgot to charge? A quick</text>
<text x="625.0" y="343.48" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#333">top-up covers the ride home.</text>
