<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Is the deal real? The five-minute check"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">Is the deal real? The five-minute check</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">Works on any product, in any store, on any sale day</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Ignore the crossed-out price</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">“Was”, “reg” and “compare at” are each</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">store's own rule, not proof anyone paid</text><text x="60.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">it.</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Copy the full model number</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Bundle codes, colours, refurbished units</text><text x="440.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">and store-only versions are different</text><text x="440.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">products.</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Check three stores</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">The maker's store, one big-box store and</text><text x="820.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">one more. The real price is what they</text><text x="820.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">charge.</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Look at the history</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Google's price insights or a tracker: is</text><text x="60.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">today under the last 90 days' low, or</text><text x="60.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">just typical?</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Read the fine print</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Sign-in, card-only, Kohl's Cash, a bundle</text><text x="440.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">or a gift card is not the same as a lower</text><text x="440.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">price.</text>
<rect x="800.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="340" r="20" fill="#1B2A41"/><text x="834.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="864.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Buy where a later drop is paid back</text>
<text x="820.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Target to Dec 24, Best Buy on its own</text><text x="820.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">drops, Costco for 30 days. Walmart.com:</text><text x="820.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">buy at the low only.</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">Sources: FTC Guides Against Deceptive Pricing (16 CFR 233.1); Target, Walmart and Best Buy reference-price pages (Nov 2026); Consumers' Checkbook (Nov 13, 2025). Our synthesis.</text>
</g></svg>