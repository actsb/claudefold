<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Set up an e-reader without the extras"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">Set up an e-reader without the extras</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">Do these in the first 30 days, while you can still return it</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Check the ads</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Base Kindle and Paperwhite show</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">lockscreen ads. Amazon's pop-up shows the</text><text x="60.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">removal price before you pay.</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Pick your library route</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Kobo has Libby built in. Kindle sends</text><text x="440.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">loans from the Libby app on a phone.</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Use Reading so far</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Ask this Book and Recaps cannot be turned</text><text x="820.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">off; choosing Reading so far limits</text><text x="820.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">spoilers.</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Clear the history</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Clear History in the Ask this Book panel;</text><text x="60.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">Amazon says it clears itself after 90</text><text x="60.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">days idle.</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Test the screen</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Open dark mode and look at the edges for</text><text x="440.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">glow. Exchange a bad unit inside the</text><text x="440.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">window.</text>
<rect x="800.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="340" r="20" fill="#1B2A41"/><text x="834.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="864.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Read update notes</text>
<text x="820.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Owners report updates that drained</text><text x="820.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">batteries or hid books. Update on Wi-Fi</text><text x="820.0" y="422" font-size="15" font-weight="400" fill="#333" text-anchor="start">with a full charge.</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">From Amazon's and Kobo's help pages and Prof H Lab, read Nov 13, 2026. Menu names change with updates.</text>
</g></svg>