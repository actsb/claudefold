<text x="40" y="554" font-size="13" font-weight="400" fill="#888" text-anchor="start">Sources: Target, Best Buy and Kobo listings, Nov 13, 2026; Kindle+ page (Oct 22, 2026); Kobo Plus per TechRadar. Ad removal about $20 is one tester's</text><text x="40" y="571" font-size="13" font-weight="400" fill="#888" text-anchor="start">figure. Taxes excluded.</text>
