<g transform="translate(382.75 106) scale(1.0)"><path d="M 18 100 C 40 60, 60 130, 84 90 S 110 50, 124 74" fill="none" stroke="#1B2A41" stroke-width="8" stroke-linecap="round"/><rect x="10" y="88" width="22" height="24" rx="4" fill="#1B2A41"/><path d="M 96 42 q 18 -14 30 4 l -8 22 q -12 -6 -22 -2 z" fill="#C9781B" opacity="0.9"/></g>
<text x="330.5" y="296.48" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#1B2A41">It sees the phone cable</text>
<text x="330.5" y="322.48" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#333">Camera + AI steer around</text>
<text x="330.5" y="343.48" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#333">cables, socks and the dog&#x27;s</text>
<text x="330.5" y="364.48" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#333">accident. No rescue call at</text>
<text x="330.5" y="385.48" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15.5" fill="#333">work.</text>
