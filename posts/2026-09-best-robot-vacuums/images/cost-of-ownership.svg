<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 545" role="img" aria-label="Three-year cost of ownership estimate for budget, mid-range, and flagship robot vacuums">
<rect width="1000" height="545" fill="#fff"/>
<g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1B2A41">What a robot vacuum really costs over three years (estimate)</text>
<g font-size="13" fill="#1B2A41" font-weight="700">
<text x="30" y="118">Budget self-empty</text><text x="30" y="136" font-weight="400" fill="#555">e.g. Shark PowerDetect, Q7 M5+</text>
<text x="30" y="228">Mid-range omni</text><text x="30" y="246" font-weight="400" fill="#555">e.g. Qrevo Curv 2 Flow, L50 Ultra</text>
<text x="30" y="338">Flagship omni+</text><text x="30" y="356" font-weight="400" fill="#555">e.g. Saros 10R, X9S Pro Omni</text>
</g>
<!-- scale: $1,600 = 700px, x0 = 240 -->
<g font-size="12" fill="#fff" font-weight="700" text-anchor="middle">
<!-- budget: 300 + 60 + 45 + 30 = 435 -->
<rect x="240" y="100" width="131" height="40" fill="#1B2A41"/><text x="305" y="125">$300</text>
<rect x="371" y="100" width="26" height="40" fill="#1E8E5A"/><text x="384" y="125" font-size="10">$60</text>
<rect x="397" y="100" width="20" height="40" fill="#4FA37B"/>
<rect x="417" y="100" width="13" height="40" fill="#C9781B"/>
<text x="445" y="125" fill="#1B2A41" text-anchor="start" font-size="14">$435 total</text>
<!-- mid: 700 + 60 + 60 + 45 + 60 + 60 = 985 -->
<rect x="240" y="210" width="306" height="40" fill="#1B2A41"/><text x="393" y="235">$700</text>
<rect x="546" y="210" width="26" height="40" fill="#1E8E5A"/>
<rect x="572" y="210" width="26" height="40" fill="#4FA37B"/>
<rect x="598" y="210" width="20" height="40" fill="#C9781B"/>
<rect x="618" y="210" width="26" height="40" fill="#E0A24A"/>
<rect x="644" y="210" width="26" height="40" fill="#999"/>
<text x="685" y="235" fill="#1B2A41" text-anchor="start" font-size="14">$985 total</text>
<!-- flagship: 1100 + 75 + 75 + 60 + 90 + 120 = 1520 -->
<rect x="240" y="320" width="481" height="40" fill="#1B2A41"/><text x="480" y="345">$1,100</text>
<rect x="721" y="320" width="33" height="40" fill="#1E8E5A"/>
<rect x="754" y="320" width="33" height="40" fill="#4FA37B"/>
<rect x="787" y="320" width="26" height="40" fill="#C9781B"/>
<rect x="813" y="320" width="39" height="40" fill="#E0A24A"/>
<rect x="852" y="320" width="53" height="40" fill="#999"/>
<text x="915" y="345" fill="#1B2A41" text-anchor="start" font-size="14">$1,520</text>
</g>
<!-- legend -->
<g font-size="13" fill="#222">
<rect x="240" y="400" width="16" height="16" fill="#1B2A41"/><text x="262" y="413">Purchase (typical sale price)</text>
<rect x="470" y="400" width="16" height="16" fill="#1E8E5A"/><text x="492" y="413">Dust bags ($20–$40/yr)</text>
<rect x="690" y="400" width="16" height="16" fill="#4FA37B"/><text x="712" y="413">Filters ($15–$30/yr)</text>
<rect x="240" y="430" width="16" height="16" fill="#C9781B"/><text x="262" y="443">Side/main brushes ($10–$20/yr)</text>
<rect x="470" y="430" width="16" height="16" fill="#E0A24A"/><text x="492" y="443">Mop pads/rollers ($20–$30/yr)</text>
<rect x="690" y="430" width="16" height="16" fill="#999"/><text x="712" y="443">Cleaning solution ($20–$40/yr)</text>
</g>
<text x="500" y="484" text-anchor="middle" font-size="12" fill="#777">Consumable ranges from 2026 buying guides and manufacturer accessory pricing; assumes daily runs in a ~1,500 sq ft home.</text><text x="500" y="502" text-anchor="middle" font-size="12" fill="#777">Bagless docks (Shark, Ecovacs OmniCyclone) drop the bag line to $0.</text>
<text x="500" y="528" text-anchor="middle" font-size="12" fill="#777">Rule of thumb: consumables add $100–$200 over three years on a self-empty robot and $250–$400 on an omni dock that uses solution.</text>
</g>
</svg>
