<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Thanksgiving week, in order"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">Thanksgiving week, in order</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">From thaw to leftovers for a Thursday, November 26 dinner</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Sat Nov 21: start thawing</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">16–20 lb bird: 4–5 days in the fridge</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">(FSIS).</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Mon Nov 23: shop</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Roaster, thermometer, containers in</text><text x="440.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">hand;.</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Wed Nov 25: test and prep</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Ice-water check the thermometer; make</text><text x="820.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">gravy base.</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Thu Nov 26: roast</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">325°F oven; probe thigh, wing, breast to</text><text x="60.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">165°F.</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Thu Nov 26: serve</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Hot food at 140°F or above; put leftovers</text><text x="440.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">away within 2 hours.</text>
<rect x="800.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="340" r="20" fill="#1B2A41"/><text x="834.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="864.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Sun Nov 29: last day</text>
<text x="820.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Eat or freeze leftovers by day 3–4 (FSIS:</text><text x="820.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">3–4 days).</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">Sources: USDA FSIS thaw and leftovers guidance; University of Illinois Extension on thermometer placement. Dates are our arithmetic for 2026.</text>
</g></svg>