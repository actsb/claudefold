<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Set up a doorbell that never needs a plan"><rect width="1200" height="540" rx="18" fill="#F7F5F0"/><g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<text x="40" y="52" font-size="30" font-weight="800" fill="#1B2A41" text-anchor="start">Set up a doorbell that never needs a plan</text>
<text x="40" y="84" font-size="20" font-weight="400" fill="#555" text-anchor="start">Do these before the free trial ends</text>
<rect x="40.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="146" r="20" fill="#1B2A41"/><text x="74.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="104.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Read the transformer</text>
<text x="60.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">eufy wants 16 to 24 V AC at 30 VA for</text><text x="60.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">wired mode; under 10 VA owners report</text><text x="60.0" y="228" font-size="15" font-weight="400" fill="#333" text-anchor="start">drain and missed rings.</text>
<rect x="420.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="146" r="20" fill="#1B2A41"/><text x="454.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="484.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Pick the storage</text>
<text x="440.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">An endurance microSD for Reolink, Aqara</text><text x="440.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">or Tapo; eufy's 8 GB is built in.</text>
<rect x="800.0" y="112" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="146" r="20" fill="#1B2A41"/><text x="834.0" y="153" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="864.0" y="152" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Format the card</text>
<text x="820.0" y="188" font-size="15" font-weight="400" fill="#333" text-anchor="start">Format it in the app on day one and check</text><text x="820.0" y="208" font-size="15" font-weight="400" fill="#333" text-anchor="start">a test clip plays back.</text>
<rect x="40.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="74.0" cy="340" r="20" fill="#1B2A41"/><text x="74.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="104.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Shrink the zone</text>
<text x="60.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Cut the street out of the motion zone; it</text><text x="60.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">is the top battery drain owners name.</text>
<rect x="420.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="454.0" cy="340" r="20" fill="#1B2A41"/><text x="454.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="484.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Turn off what you skip</text>
<text x="440.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">On Ring, turn off Search Party per camera</text><text x="440.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">in Control Center.</text>
<rect x="800.0" y="306" width="360.0" height="176" rx="16" fill="#fff" stroke="#E3E1DB"/>
<circle cx="834.0" cy="340" r="20" fill="#1B2A41"/><text x="834.0" y="347" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="864.0" y="346" font-size="19" font-weight="800" fill="#1B2A41" text-anchor="start">Check after updates</text>
<text x="820.0" y="382" font-size="15" font-weight="400" fill="#333" text-anchor="start">Owners on eufy and Aqara report firmware</text><text x="820.0" y="402" font-size="15" font-weight="400" fill="#333" text-anchor="start">that broke chimes or batteries.</text>
<text x="40" y="518" font-size="13" font-weight="400" fill="#888" text-anchor="start">From the makers' install and support pages and owner forum threads, read November 11, 2026.</text>
</g></svg>